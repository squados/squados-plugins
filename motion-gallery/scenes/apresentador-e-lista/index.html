<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apresentador e Lista</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { color: #f2f5fb; background: #111318; }
.presenter, .shade { position: absolute; inset: 0; }
.presenter > :is(img,video) { display:block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 44%; transform-origin: 50% 0; }
.shade { background: linear-gradient(90deg,#090e16e6 0%,#090e16bc 31%,#090e1670 45%,transparent 63%); }
.panel { position: absolute; inset: 0 auto 0 103px; width: 795px; display: grid; align-content: center; }
.headline { max-width: 9em; font-size: 93px; line-height: 1.01; text-shadow: 0 4px 18px #0008; }
.items { display: grid; margin-top: 47px; }
.row { display: flex; align-items: center; gap: 24px; min-height: 95px; border-bottom: 1px solid #c1d5ff4d; color: #e0e8f5; font-size: 45px; line-height: 1.12; }
.item { min-width: 0; overflow-wrap: anywhere; line-height: 1.13; text-shadow: 0 3px 12px #000b; }
.index { min-width: 62px; min-height: 45px; display: grid; place-items: center; flex: none; border: 1px solid #a1b9d489; border-radius: 9px; color: #c5d8f1; font-size: 26px; font-weight: 620; font-variant-numeric: tabular-nums; }
.row.active .index { color: #14243a; border-color: #d2e6ff; background: #b8d7ff; }
.row.active .item { color: #f9fbff; }
</style>
</head>
<body>
<main data-composition-id="apresentador-e-lista" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
  <div class="presenter">
    <!-- motion-media:presenter:0:6.8:0 -->
  </div>
  <div class="shade" aria-hidden="true"></div>
  <section class="panel"><h1 class="headline display"></h1><div class="items"></div></section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy(".headline", "heading", "Antes de usar a resposta");
const defaults = ["Confira a fonte", "Peça um exemplo", "Revise os dados", "Teste um caso real", "Decida o próximo passo"];
const labels = Array.isArray(inputs.items) && inputs.items.length === 5
  && inputs.items.every(label => typeof label === "string") ? inputs.items : defaults;
const rows = labels.map((label, index) => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<span class="index"></span><span class="item"></span>';
  row.firstElementChild.textContent = String(index + 1).padStart(2, "0");
  one(".items").append(row);
  return { row, index: row.firstElementChild, item: row.lastElementChild, chars: Array.from(label) };
});
const headline = one(".headline");
const items = one(".items");
const camera = one(".presenter > :is(img,video)");
const starts = [.69, 1.59, 2.49, 3.39, 4.29];
window.renderMotion = time => {
  const reframe = flow(phase(time, 0, .64));
  if (camera) camera.style.transform = "translateX(" + 326 * reframe + "px) scale(" + mix(1, 1.39, reframe) + ")";
  one(".shade").style.opacity = reframe;
  const enter = snap(time, .31, .25);
  const leave = flow(phase(time, 6.44, .30));
  set(headline, { opacity: enter * (1 - leave), transform: "translateY(" + (18 * (1 - enter) - 9 * leave) + "px)" });
  items.style.opacity = 1 - leave;
  let active = -1;
  starts.forEach((start, index) => {
    if (time >= start) active = index;
  });
  rows.forEach(({ row, index: badge, item, chars }, index) => {
    const show = snap(time, starts[index], .23);
    const type = phase(time, starts[index] + .03, .29);
    item.textContent = chars.slice(0, Math.ceil(chars.length * type)).join("");
    set(row, { opacity: show, transform: "translateX(" + -18 * (1 - show) + "px)" });
    row.classList.toggle("active", index === active);
    badge.style.transform = index === active ? "scale(" + mix(.89, 1, spring(time, starts[index], .29)) + ")" : "none";
  });
};
window.renderMotion(0);
</script>
</body>
</html>
