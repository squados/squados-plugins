<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Confete</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main:not(.transparent) { background: radial-gradient(ellipse at 50% 30%, #3d3248, #161725 63%, #101019); }
main.transparent { background: transparent; }
.camera, .camera > :is(img, video) { position: absolute; inset: 0; width: 100%; height: 100%; }
.camera > :is(img, video) { object-fit: cover; }
canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<main data-composition-id="confete" data-start="0" data-duration="4" data-width="1920" data-height="1080">
<div class="camera"><!-- motion-media:presenter:0:4:0 --></div>
<canvas width="1920" height="1080"></canvas>
</main>
<script src="../motion-assets/time.js"></script>
<script>
stage.classList.toggle("transparent", inputs.transparent === true && !one(".camera > *"));
const at = Number.isFinite(inputs.at) ? Math.min(2.5, Math.max(0, inputs.at)) : .35;
const amount = Number.isInteger(inputs.amount) ? Math.min(320, Math.max(30, inputs.amount)) : 150;
const palette = Array.isArray(inputs.colors) && inputs.colors.length
  ? inputs.colors.slice(0, 8)
  : ["#a98bff", "#ffd166", "#06d6a0", "#ef476f", "#4cc9f0", "#ffffff"];

// Semente fixa: o mesmo render sai igual quadro a quadro.
let seed = 20261109;
const random = () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
  return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
};
const between = (a, b) => a + (b - a) * random();
const gravity = 1450, drag = 2.3;
const pieces = [];
for (const side of [-1, 1]) {
  for (let i = 0; i < amount; i++) {
    // Os dois canhões ficam nos cantos de baixo e miram o alto do centro.
    const angle = between(14, 42) * Math.PI / 180;
    const speed = between(2300, 3900);
    const kind = random();
    pieces.push({
      x: side < 0 ? -30 : 1950,
      y: between(1000, 1100),
      vx: -side * Math.sin(angle) * speed,
      vy: -Math.cos(angle) * speed,
      delay: at + between(0, .16),
      shape: kind < .5 ? "rect" : kind < .82 ? "ribbon" : "dot",
      size: between(.75, 1.3),
      color: palette[Math.floor(random() * palette.length)],
      spin: between(-9, 9),
      tilt: between(0, Math.PI * 2),
      wobble: between(7, 15),
      sway: between(10, 30),
      life: between(2.6, 3.4),
    });
  }
}

const canvas = one("canvas");
const context = canvas.getContext("2d");
window.renderMotion = time => {
  context.clearRect(0, 0, 1920, 1080);
  for (const piece of pieces) {
    const age = time - piece.delay;
    if (age <= 0) continue;
    // Arrasto linear: a peça perde a velocidade inicial e cai na velocidade final de g / arrasto.
    const decay = 1 - Math.exp(-drag * age);
    const terminal = gravity / drag;
    const x = piece.x + piece.vx / drag * decay + Math.sin(piece.wobble * .5 * age + piece.tilt) * piece.sway * Math.min(1, age);
    const y = piece.y + terminal * age + (piece.vy - terminal) / drag * decay;
    const fade = 1 - clamp((age - piece.life + .5) / .5);
    if (fade <= 0 || y > 1160) continue;
    context.save();
    context.globalAlpha = fade;
    context.translate(x, y);
    context.rotate(piece.tilt + piece.spin * age);
    context.scale(1, Math.cos(piece.wobble * age + piece.tilt));
    context.fillStyle = piece.color;
    const s = piece.size;
    if (piece.shape === "rect") context.fillRect(-9 * s, -6 * s, 18 * s, 12 * s);
    else if (piece.shape === "ribbon") context.fillRect(-4 * s, -15 * s, 8 * s, 30 * s);
    else { context.beginPath(); context.arc(0, 0, 7 * s, 0, Math.PI * 2); context.fill(); }
    context.restore();
  }
};
window.renderMotion(0);
</script>
</body>
</html>
