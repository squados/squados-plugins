<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background: #e8eddd; color: #1c2d21; }
.heading { position: absolute; left: 128px; top: 294px; width: 730px; font-size: 135px; }
.heading::before { content: ""; display: block; width: 78px; height: 12px; border-radius: 20px; margin-bottom: 44px; background: #548337; }
.posts { position: absolute; inset: 200px 115px 140px 965px; }
.post { position: absolute; inset: 105px 0 auto; min-height: 357px; padding: 56px 57px 47px; border-radius: 28px; background: #f9faef; border: 2px solid #bdcbb2; box-shadow: 0 20px 56px #233e1c21; }
.post p { font-size: 52px; letter-spacing: -.04em; }
.author { display: flex; align-items: center; gap: 18px; font-size: 29px; font-weight: 650; margin-bottom: 32px; color: #53644d; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: #b9cd9a; display: grid; place-items: center; color: #344824; }
.tag { position: relative; display: inline-block; overflow: hidden; padding: 10px 22px; margin-top: 26px; border-radius: 999px; background: #d4e9b4; font-size: 30px; font-weight: 650; }
.scan { position: absolute; top: 95px; bottom: 155px; width: 5px; pointer-events: none; background: #7da34a; box-shadow: 0 0 32px 12px #8cb85c55; border-radius: 10px; z-index: 5; }
.summary { position: absolute; left: 920px; top: 240px; width: 840px; }
.summary h2 { font-size: 89px; margin-bottom: 43px; }
.summary p { border-top: 2px solid #a6b29a; padding: 28px 0; display: flex; align-items: center; gap: 33px; font-size: 50px; letter-spacing: -.04em; }
.summary p span { color: #43692e; font-size: 28px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main data-composition-id="radar-de-sinais" data-start="0" data-duration="7.6" data-width="1920" data-height="1080">
<h1 class="heading display"></h1>
<section class="posts"><div class="scan"></div></section>
<section class="summary"><h2 class="display"></h2><div class="ranks"></div></section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy(".heading", "question", "O que travou no piloto?");
copy(".summary h2", "result", "Onde agir primeiro");
const samples = [
  { author: "Lia", text: "O resumo é ótimo. Onde eu confiro as fontes?", tag: "Fontes" },
  { author: "Caio", text: "Queria mandar o resultado para a equipe.", tag: "Compartilhar" },
  { author: "Iara", text: "Como uso o mesmo pedido amanhã?", tag: "Histórico" }
];
const list = Array.isArray(inputs.posts) && inputs.posts.length === 3 ? inputs.posts : samples;
const posts = list.map((item, index) => {
  const card = document.createElement("article");
  card.className = "post";
  card.innerHTML = '<div class="author"><span class="avatar"></span><span class="name"></span></div><p></p><span class="tag"></span>';
  card.querySelector(".name").textContent = item.author;
  card.querySelector(".avatar").textContent = item.author?.[0] ?? "";
  card.querySelector("p").textContent = item.text;
  card.querySelector(".tag").textContent = item.tag;
  one(".posts").prepend(card);
  const rank = document.createElement("p");
  const number = document.createElement("span");
  number.textContent = String(index + 1).padStart(2, "0");
  rank.append(number, document.createTextNode(item.tag));
  one(".ranks").append(rank);
  return card;
});
window.renderMotion = time => {
  const collapse = beat(time, 4.92, .58);
  const start = beat(time, .08, .65);
  set(one(".heading"), { opacity: start, transform: "translateY(" + (1 - start) * 55 + "px)" });
  set(one(".posts"), { opacity: 1 - collapse, transform: "translateX(" + -120 * collapse + "px) scale(" + mix(1, .91, collapse) + ")" });
  posts.forEach((post, index) => {
    const position = .42 + index * 1.32;
    const appear = beat(time, position, .54);
    const exit = index === posts.length - 1 ? 0 : beat(time, position + 1.3, .49);
    set(post, { opacity: appear * (1 - exit), transform: "translate(" + (mix(260, 0, appear) - 150 * exit) + "px," + (-32 * exit) + "px) rotate(" + (mix(7, 0, appear) - 7 * exit) + "deg)" });
    post.querySelector(".tag").style.clipPath = "inset(0 " + (1 - beat(time, position + .73, .34)) * 100 + "% 0 0)";
  });
  const scan = ((time - .83) % 1.32 + 1.32) % 1.32;
  set(one(".scan"), { opacity: time > .83 && time < 4.2 ? Math.sin(Math.PI * clamp(scan / .72)) * .9 : 0, left: mix(6, 98, clamp(scan / .72)) + "%" });
  const show = beat(time, 5.08, .62);
  set(one(".summary"), { opacity: show, transform: "translateY(" + (1 - show) * 56 + "px)" });
  all(".ranks p").forEach((row, i) => row.style.clipPath = "inset(0 " + (1 - beat(time, 5.42 + i * .22, .44)) * 100 + "% 0 0)");
};
window.renderMotion(0);
</script>
</body>
</html>
