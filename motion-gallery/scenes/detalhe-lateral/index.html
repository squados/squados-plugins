<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../motion-assets/base.css">
  <style>
    main { background: #141119; }
    .camera { position: absolute; inset: 0; transform-origin: 0 0; }
    .camera > * { width: 100%; height: 100%; object-fit: cover; }
    .shade { position: absolute; inset: 0; }
    .detail { position: absolute; top: 0; left: 0; border-radius: 22px; overflow: hidden; outline: 1px solid #dad2e14f; box-shadow: 0 18px 55px #0a080dc2; }
    .detail header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 0 21px; background: #1b1821; color: #f7f3fa; font-size: 27px; height: 56px; }
    .detail header small { color: #bfb5c8; font-size: 19px; }
    .viewport { position: relative; overflow: hidden; }
    .viewport > img, .viewport > video { display: block; width: 100%; height: auto; }
    .highlight { position: absolute; left: 0; top: 0; border: 3px solid #cbb5ff; border-radius: 8px; box-shadow: 0 0 0 1400px #0d0a14a0; background: #ad88ff1a; }
  </style>
</head>
<body>
  <main data-composition-id="detalhe-lateral" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="camera"><!-- motion-media:presenter:0:5:0 --></div>
    <div class="shade" aria-hidden="true"></div>
    <section class="detail">
      <header><b></b><small></small></header>
      <div class="viewport"><!-- motion-media:screen:0:5:1 --><div class="highlight" aria-hidden="true"></div></div>
    </section>
  </main>
  <script src="motion.js"></script>
  <script>
    const config = window.motionInputs ?? {};
    const camera = document.querySelector('.camera');
    const shade = document.querySelector('.shade');
    const detail = document.querySelector('.detail');
    const viewport = document.querySelector('.viewport');
    const media = document.querySelector('#motion-media-screen');
    const highlight = document.querySelector('.highlight');
    const pixel = value => value + 'px';
    const ground = 'rgb(' + sideDetail.background.join(' ') + ')';
    detail.querySelector('b').textContent = config.label ?? 'Detalhe';
    detail.querySelector('small').textContent = config.location ?? '';

    window.renderMotion = time => {
      if (!media) return;
      const width = media.naturalWidth || media.videoWidth || 1200;
      const height = media.naturalHeight || media.videoHeight || 800;
      const pose = sideDetail.sample(time, config, { width, height });
      const a = pose.camera;
      const s = pose.shade;
      const p = pose.panel;
      camera.style.transform = `translate(${pixel(a.x)}, ${pixel(a.y)}) scale(${a.scale})`;
      shade.style.background = a.amount === 0 ? 'none' : `linear-gradient(to ${s.opposite ? 'left' : 'right'}, transparent ${pixel(s.from)}, ${ground} ${pixel(s.to)})`;
      detail.style.visibility = p.amount === 0 ? 'hidden' : 'visible';
      detail.style.transform = `translate(${pixel(p.x)}, ${pixel(p.y)})`;
      detail.style.width = pixel(p.width);
      viewport.style.height = pixel(p.height);
      media.style.transform = `translateY(${pixel(-p.scroll)})`;
      const h = p.highlight;
      highlight.style.visibility = h?.opacity > 0 ? 'visible' : 'hidden';
      if (h) Object.assign(highlight.style, {
        transform: `translate(${pixel(h.x)}, ${pixel(h.y)})`,
        width: pixel(h.width), height: pixel(h.height), opacity: h.opacity,
      });
    };
    window.renderMotion(0);
  </script>
</body>
</html>
