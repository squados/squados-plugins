<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista de Notificações</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/vidro.css">
<style>
.stack { position: absolute; top: 112px; right: 110px; width: 600px; height: 860px; }
main.left .stack { right: auto; left: 110px; }
.note { position: absolute; left: 0; top: 0; width: 100%; height: 132px; border-radius: 34px; display: flex; align-items: center; gap: 24px; padding: 0 30px 0 26px; transform-origin: 50% 0; }
.note .icon { width: 76px; height: 76px; flex: none; border-radius: 22px; box-shadow: inset 0 1px 0 #ffffff59, 0 10px 22px #0005; }
.body { min-width: 0; flex: 1; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.title { font-size: 32px; font-weight: 640; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { flex: none; font-size: 23px; font-weight: 450; color: var(--muted); }
.detail { margin-top: 6px; font-size: 27px; font-weight: 430; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main data-composition-id="lista-de-notificacoes" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="camera"><!-- motion-media:presenter:0:6:0 --></div>
<div class="stack"></div>
</main>
<script src="../motion-assets/time.js"></script>
<script src="../motion-assets/icones.js"></script>
<script>
// Composição própria inspirada no Animated List do Magic UI (MIT): cada aviso chega no topo e empurra os anteriores.
stage.classList.toggle("transparent", inputs.transparent === true && !one(".camera > *"));
stage.classList.toggle("claro", inputs.theme === "claro");
if (inputs.side === "left") stage.classList.add("left");
const fallback = [
  { icon: "venda", title: "Nova venda", detail: "Plano anual · R$ 497", time: "agora", color: "#22a565" },
  { icon: "agenda", title: "Reunião agendada", detail: "Quinta, 14h · Apresentação", time: "agora", color: "#6366f1" },
  { icon: "mensagem", title: "Contato no WhatsApp", detail: "Quer saber os horários disponíveis", time: "agora", color: "#119c78" },
  { icon: "estrela", title: "Avaliação 5 estrelas", detail: "“Atendimento rápido e certeiro”", time: "agora", color: "#e59a0b" },
  { icon: "pagamento", title: "Pagamento confirmado", detail: "Pix · R$ 1.290", time: "agora", color: "#0b8fd0" },
  { icon: "contrato", title: "Proposta aceita", detail: "Contrato enviado para assinatura", time: "agora", color: "#db3f8f" },
];
const items = (Array.isArray(inputs.items) && inputs.items.length ? inputs.items : fallback).slice(0, 8);
const start = Number.isFinite(inputs.start) ? Math.min(3, Math.max(0, inputs.start)) : .4;
const interval = Number.isFinite(inputs.interval) ? Math.min(1.6, Math.max(.3, inputs.interval)) : .78;
const visible = 5, step = 148;

const stack = one(".stack");
const notes = items.map((item, index) => {
  const note = document.createElement("article");
  note.className = "pane note";
  const icon = document.createElement("div");
  icon.className = "icon";
  icon.style.background = "linear-gradient(145deg, " + (item.color || "#7c5cff") + ", color-mix(in srgb, " + (item.color || "#7c5cff") + " 62%, #0d0b18))";
  window.motionIcon(icon, item.icon || "check");
  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = '<div class="head"><span class="title"></span><span class="time"></span></div><p class="detail"></p>';
  body.querySelector(".title").textContent = item.title ?? "";
  body.querySelector(".time").textContent = item.time ?? "agora";
  body.querySelector(".detail").textContent = item.detail ?? "";
  note.append(icon, body);
  stack.append(note);
  return { note, at: start + index * interval };
});

window.renderMotion = time => {
  notes.forEach(({ note, at }, index) => {
    const enter = spring(time, at, .55);
    // Cada aviso posterior que chegou empurra este uma posição para baixo.
    const slot = notes.slice(index + 1).reduce((sum, later) => sum + spring(time, later.at, .55), 0);
    const leaving = clamp(slot - (visible - 1));
    set(note, {
      opacity: clamp(enter * 1.4) * (1 - leaving),
      zIndex: 100 - index,
      transform: "translateY(" + (slot * step - (1 - Math.min(1, enter)) * 46) + "px) scale(" + (mix(.9, 1, Math.min(1, enter)) - .06 * leaving) + ")",
    });
  });
};
window.renderMotion(0);
</script>
</body>
</html>
