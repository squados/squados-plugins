<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Escritório com Troca de Equipe</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/edicao-reutilizavel.css">
</head><body>
<main data-variant="office" data-composition-id="escritorio-troca-de-equipe" data-start="0" data-duration="7.5" data-width="1920" data-height="1080"><canvas width="1920" height="1080" style="display:block;width:100%;height:100%"></canvas></main>
<script type="module">
import {createRoom} from './office.bundle.js';
const inputs = window.motionInputs || {};
const duration = 7.5;
const story = {desks:.55,people:3.08,swap:5.64,duration,...inputs.story};
window.renderMotion = () => {};
window.motionReady = createRoom(document.querySelector('canvas'), {mode:'team', width:1920,height:1080,story,atlas:inputs.atlas})
  .then(draw => {window.renderMotion=draw;draw(0);});
await window.motionReady;
</script>
</body></html>
