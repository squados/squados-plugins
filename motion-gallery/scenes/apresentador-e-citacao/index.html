<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apresentador e Citação</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background:#121212; color:#ffe0aa; }
.portrait, .shade { position:absolute; inset:0; }
.portrait :is(video,img) { width:100%; height:100%; display:block; object-fit:cover; object-position:50% 50%; filter:grayscale(1) contrast(1.02); }
.shade { background:linear-gradient(270deg,#080808e0,#080808a3 24%,#08080824 43%,transparent 55%); }
.copy { position:absolute; left:1240px; top:54%; width:590px; transform:translateY(-50%); }
.quote { font-size:79px; letter-spacing:-.043em; font-weight:630; line-height:1.03; text-shadow:0 4px 20px #000a; }
.byline { margin-top:34px; color:#f0d8b3; font-size:35px; text-shadow:0 3px 16px #000a; }
.emphasis { --ink:0%; color:#ffd18a; background:linear-gradient(#ffbd61,#ffbd61) 0 99% / var(--ink) 4px no-repeat; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
</style>
</head>
<body>
<main data-composition-id="apresentador-e-citacao" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
<div class="portrait"><!-- motion-media:portrait:0:6.8:0 --></div>
<div class="shade" aria-hidden="true"></div>
<section class="copy"><p class="quote"></p><p class="byline"></p></section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const quote=String(inputs.quote ?? "Um bom prompt começa com contexto.");
const phrase=String(inputs.emphasis ?? "começa com contexto.");
const offset=phrase?quote.toLowerCase().indexOf(phrase.toLowerCase()):-1;
const excerpt=one(".quote");
if(offset<0) excerpt.textContent=quote;
else {
  const span=document.createElement("span");
  span.className="emphasis";
  span.textContent=quote.slice(offset,offset+phrase.length);
  excerpt.append(document.createTextNode(quote.slice(0,offset)),span,document.createTextNode(quote.slice(offset+phrase.length)));
}
copy(".byline","attribution","Aula de IA");
window.renderMotion = time => {
  const shown=snap(time,.35,.25);
  set(one(".copy"),{opacity:shown,transform:"translate("+mix(25,0,shown)+"px,-50%)"});
  one(".emphasis")?.style.setProperty("--ink",100*snap(time,2.42,.30)+"%");
};
window.renderMotion(0);
</script>
</body>
</html>
