<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apresentador e Citação</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background:radial-gradient(ellipse at 23% 69%,#484950,#29292e 44%,#19191c 88%); color:#f3f2f0; }
.portrait { position:absolute; inset:0 49% 0 0; overflow:hidden; }
.portrait :is(video,img) { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; object-position:50% 49%; filter:grayscale(.94) contrast(.94); }
.copy { position:absolute; left:1010px; top:50%; width:780px; transform:translateY(-50%); }
.quote { font-size:85px; letter-spacing:-.038em; font-weight:620; line-height:1.06; }
.byline { margin-top:36px; color:#c0c3cb; font-size:33px; }
.emphasis { --ink:0%; background:linear-gradient(#d7bb83,#d7bb83) 0 96% / var(--ink) 4px no-repeat; box-decoration-break:clone; }
</style>
</head>
<body>
<main data-composition-id="apresentador-e-citacao" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
<div class="portrait"><!-- motion-media:portrait:0:6.8:0 --></div>
<section class="copy"><p class="quote"></p><p class="byline"></p></section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const quote=String(inputs.quote ?? "Um bom prompt começa com contexto.");
const phrase=String(inputs.emphasis ?? "começa com contexto.");
const offset=phrase?quote.toLowerCase().indexOf(phrase.toLowerCase()):-1;
const excerpt=one(".quote");
if(offset<0) excerpt.textContent=quote;
else {
  const span=document.createElement("span");
  span.className="emphasis";
  span.textContent=quote.slice(offset,offset+phrase.length);
  excerpt.append(document.createTextNode(quote.slice(0,offset)),span,document.createTextNode(quote.slice(offset+phrase.length)));
}
copy(".byline","attribution","Aula de IA");
window.renderMotion = time => {
  const portrait=beat(time,.02,.46);
  const shown=beat(time,.53,.45);
  one(".portrait").style.opacity=portrait;
  set(one(".copy"),{opacity:shown,transform:"translate("+mix(35,0,shown)+"px,-50%)"});
  one(".emphasis")?.style.setProperty("--ink",100*flow(phase(time,2.74,.60))+"%");
};
window.renderMotion(0);
</script>
</body>
</html>
