<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fábrica de Edição 3D</title>
<style>
@font-face { font-family: Outfit; src: url("assets/outfit.ttf"); font-weight: 100 900; }
html, body { margin: 0; overflow: hidden; background: #131a25; }
main { position: relative; width: 1920px; height: 1080px; }
canvas { display: block; }
</style>
</head>
<body>
<main data-composition-id="fabrica-de-edicao-3d" data-width="1920" data-height="1080" data-start="0" data-duration="15.533333">
  <canvas width="1920" height="1080" aria-label="Linhas de edição de vídeo em um galpão 3D"></canvas>
</main>
<script>
const composition = document.querySelector('main');
const duration = () => Number(composition.dataset.duration);
let clock = 0;
window.__hfTimelinesBuilding = true;
window.renderMotion = () => {};
window.__timelines = {
  'fabrica-de-edicao-3d': {
    duration, totalDuration: duration, paused: () => true, pause() { return this; },
    play() { return this; }, getChildren() { return []; },
    time(t) { if (t === undefined) return clock; clock = t; window.renderMotion(t); return this; },
    seek(t) { return this.time(t); }, totalTime(t) { return this.time(t); }
  }
};
</script>
<script src="./factory.bundle.js"></script>
</body>
</html>
