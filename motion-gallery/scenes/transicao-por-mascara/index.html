<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Transição por Máscara</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background:#151323; color:#fff4da; }
.plate,.plate img,.plate video { position:absolute; inset:0; width:100%; height:100%; }
.plate { overflow:hidden; }
.plate img,.plate video { object-fit:cover; }
.a { background:radial-gradient(ellipse at 85% 21%,#c26c52,transparent 52%),linear-gradient(142deg,#201b31 18%,#76374e 86%); }
.b { background:radial-gradient(ellipse at 78% 20%,#6a99af,transparent 56%),linear-gradient(143deg,#171b33 16%,#253d66 85%); }
.field { position:absolute; width:1050px; height:1050px; right:-75px; bottom:-400px; transform:rotate(-16deg); }
.field circle { fill:none; stroke:currentColor; stroke-width:1; }
.a .field { color:#ffc990; opacity:.65; }
.b .field { right:-15px; bottom:-308px; color:#bcf2ff; opacity:.64; transform:rotate(22deg); }
.copy { position:absolute; left:142px; top:438px; }
.kicker { display:flex; align-items:center; gap:20px; letter-spacing:.24em; text-transform:uppercase; font-size:24px; }
.kicker::before { content:""; background:currentColor; width:50px; height:2px; }
h1 { font-size:154px; font-weight:620; line-height:.92; letter-spacing:-.057em; max-width:1210px; }
.index { position:absolute; left:148px; bottom:100px; opacity:.77; font:24px ui-monospace,monospace; letter-spacing:.14em; }
.plate.has-media .copy,.plate.has-media .field,.plate.has-media .index { display:none; }
#edge { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
</style></head><body>
<main data-composition-id="transicao-por-mascara" data-start="0" data-duration="4.8" data-width="1920" data-height="1080">
<section class="plate a"><svg class="field" viewBox="0 0 1000 1000" aria-hidden="true"></svg><div class="copy"><p class="kicker">Luz incidente</p><h1>Primeira luz.</h1></div><p class="index">01 / MATÉRIA</p><!-- motion-media:first:0:4.8:1 --></section>
<section class="plate b"><svg class="field" viewBox="0 0 1000 1000" aria-hidden="true"></svg><div class="copy"><p class="kicker">Campo aberto</p><h1>Outro horizonte.</h1></div><p class="index">02 / ESPAÇO</p><!-- motion-media:second:0:4.8:2 --></section>
<svg id="edge" viewBox="0 0 1920 1080" aria-hidden="true"><polyline fill="none" stroke="#ffc494" stroke-width="6"/><g></g></svg>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const mode = ['brush','pixel','iris'].includes(inputs.mode) ? inputs.mode : 'ink';
const a = one('.a'), b = one('.b'), edge = one('#edge'), line = one('#edge polyline');
const svg = 'http://www.w3.org/2000/svg';
const range = length => Array.from({length}, (_,i) => i);
const at = Number.isFinite(inputs.at) ? Math.max(.55,Math.min(3.5,inputs.at)) : 1.95;
a.classList.toggle('has-media',!!one('#motion-media-first'));
b.classList.toggle('has-media',!!one('#motion-media-second'));
copy('.a h1','beforeTitle','Primeira luz.');
copy('.b h1','afterTitle','Outro horizonte.');
for (const field of all('.field')) {
  for (const i of range(31)) {
    const circle = document.createElementNS(svg,'circle');
    circle.setAttribute('cx',500 + i * 4);
    circle.setAttribute('cy',500 - i * 7);
    circle.setAttribute('r',121 + i * 12);
    field.append(circle);
  }
}
const sparks = range(32).map(i => {
  const dot = document.createElementNS(svg,mode === 'pixel' ? 'rect' : 'circle');
  dot.setAttribute('fill',i % 3 === 0 ? '#ffe5ba' : '#ffa58b');
  one('#edge g').append(dot);
  return dot;
});
window.renderMotion = t => {
  const p = flow(phase(t,at-.55,1.18));
  const moving = p > 0 && p < 1;
  edge.style.opacity = moving ? Math.min(1, Math.sin(p*Math.PI)*1.7) : 0;
  if (!moving) {
    b.style.clipPath = p === 0 ? 'inset(0 100% 0 0)' : 'none';
    return;
  }
  if (mode === 'iris') {
    const center = [1050,510];
    const radius = 1440 * p;
    b.style.clipPath = 'circle(' + radius + 'px at ' + center[0] + 'px ' + center[1] + 'px)';
    line.setAttribute('points',range(91).map(i => {
      const theta = i / 90 * Math.PI*2;
      return [center[0] + radius*Math.cos(theta),center[1] + radius*Math.sin(theta)].join(',');
    }).join(' '));
    sparks.forEach((dot,i) => {
      const theta = i * 2.399, spread = radius + 12 + i % 6 * 8;
      dot.setAttribute('cx',center[0]+Math.cos(theta)*spread);
      dot.setAttribute('cy',center[1]+Math.sin(theta)*spread);
      dot.setAttribute('r',2+i%3);
    });
    return;
  }
  const points = range(mode === 'pixel' ? 24 : 73).flatMap((i,_,rows) => {
    const y = i / (rows.length-1)*1080;
    const position = -390 + 2700*p;
    const texture = mode === 'brush' ? y*.19-90+38*Math.sin(y*.088)+29*Math.sin(y*.16)
      : mode === 'pixel' ? (i*131%210)-108 : 106*Math.sin(y*.006)+48*Math.sin(y*.019+4*p)+15*Math.sin(y*.059);
    const x = mode === 'pixel' ? Math.round((position+texture)/48)*48 : position+texture;
    return mode === 'pixel' && i > 0 ? [[x,y-1080/(rows.length-1)],[x,y]] : [[x,y]];
  });
  b.style.clipPath = 'polygon(0px 0px,' + points.map(([x,y]) => x+'px '+y+'px').join(',') + ',0px 1080px)';
  line.setAttribute('points',points.map(point => point.join(',')).join(' '));
  sparks.forEach((dot,i) => {
    const [x,y] = points[Math.floor(i/(sparks.length-1)*(points.length-1))];
    const ahead = 12+i*29%140, size = 3+i*7%10;
    const coords = mode === 'pixel' ? {x:x+ahead,y,width:size,height:size} : {cx:x+ahead,cy:y+12*Math.sin(i*4),r:size*.5};
    for (const [key,value] of Object.entries(coords)) dot.setAttribute(key,value);
  });
};
window.renderMotion(0);
</script></body></html>
