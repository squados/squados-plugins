<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Título Atrás do Apresentador</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background:#161618; color:#f6f6f6; }
.camera { position:absolute; inset:0; }
.camera :is(video,img) { display:block; width:100%; height:100%; object-fit:cover; }
.camera :is(video,img), .cutout :is(video,img) { transform:scale(1.10); transform-origin:50% 48%; }
.cutout { position:absolute; inset:0; }
.cutout :is(video,img) { width:100%; height:100%; display:block; object-fit:cover; }
.wordmark { position:absolute; inset:300px 0 auto; text-align:center; color:#fff; line-height:.86; font-size:var(--size, 250px); font-weight:740; letter-spacing:-.068em; white-space:nowrap; transform-origin:50% 50%; text-shadow:0 8px 32px #0007; }
</style>
</head>
<body>
<main data-composition-id="titulo-atras-do-apresentador" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
<div class="camera"><!-- motion-media:presenter:0:6.8:0 --></div>
<h1 class="wordmark display"><span></span></h1>
<div class="cutout"><!-- motion-media:matte:0:6.8:1 --></div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const headline=one(".wordmark");
const text=one(".wordmark span");
text.textContent=String(inputs.title ?? "MAIS CONTEXTO").trim().replace(/\s+/g," ");
document.fonts.ready.then(()=>{
  if(text.offsetWidth) headline.style.setProperty("--size",Math.min(330,250*1832/text.offsetWidth)+"px");
});
window.renderMotion = time => {
  const push=spring(time,.86,.34);
  const show=snap(time,.86,.17);
  const release=flow(phase(time,5.32,.22));
  set(headline,{opacity:show*(1-release),transform:"translateY("+((1-push)*68-release*22)+"px) scale("+mix(.93,1,push)+")"});
};
window.renderMotion(0);
</script>
</body>
</html>
