<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cena em Vidros</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/duelo.css">
<style>
h1 { position:absolute; z-index:5; top:86px; left:108px; font-size:51px; }
.rig { position:absolute; inset:0; perspective:2300px; }
.stack { position:absolute; inset:0; transform-style:preserve-3d; }
.pane { position:absolute; inset:0; transform-origin:50% 50%; border:2px solid #b3e9e381; border-radius:20px; background:#a5cde30c; box-shadow:0 0 40px #78b9db28,inset 0 0 90px #79add925; }
.pane .badge { position:absolute; top:28px; left:32px; background:#11121ae8; color:var(--mint); padding:10px 19px; font-size:58px; border-radius:10px; }
.pane:nth-child(-n+2) .badge { left:auto; right:38px; }
[data-layout="aninhado"] .pane:nth-child(2) .badge { top:129px; }
.scenery { background:repeating-linear-gradient(90deg,#292e3c 0px,#292e3c 168px,#252635 169px,#252635 173px); }
.scenery::before { content:""; position:absolute; inset:0; background:linear-gradient(110deg,#805e872a,transparent 65%),repeating-linear-gradient(0deg,transparent 0px,transparent 179px,#8f9ba355 180px,#8f9ba355 183px); }
.matte { position:absolute; inset:0; }
.symbols { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:500px; color:var(--mint); font-size:180px; text-shadow:0 0 60px currentColor; }
.symbols span:last-child { color:var(--peach); }
</style>
</head>
<body>
<main data-composition-id="cena-em-vidros" data-start="0" data-duration="8" data-width="1920" data-height="1080">
<h1></h1>
<div class="rig"><div class="stack">
  <div class="pane scenery"><p class="badge"></p></div>
  <div class="pane"><div class="symbols" aria-hidden="true"><span>◈</span><span>✳</span></div><p class="badge"></p></div>
  <div class="pane"><div class="matte"><!-- motion-media:matte:0:8:0 --></div><p class="badge"></p></div>
</div></div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const nested = inputs.layout === "aninhado";
stage.dataset.layout = nested ? "aninhado" : "aberto";
const labels = inputs.labels ?? ["Fundo", "Ícones", "Apresentador"];
const panes = all(".pane");
all(".badge").forEach((badge, index) => { badge.textContent = labels[index] ?? ""; });
copy("h1", "title", "Uma cena em três planos");
window.renderMotion = time => {
  const opening = flow(phase(time,.48,1.6));
  const turning = flow(phase(time,5.0,1.3));
  const closing = flow(phase(time,6.25,1.35));
  const separated = opening * (1 - closing);
  const angle = mix(-29,29,turning) * separated;
  set(one(".stack"),{ transform:"scale(" + mix(1,nested ? .68 : .51,separated) + ") rotateY(" + angle + "deg)" });
  panes.forEach((pane,index) => {
    const offset = index - 1;
    const x = offset * (nested ? -178 : -468) * separated;
    const z = offset * (nested ? 175 : 285) * separated;
    const y = offset * (nested ? 19 : -65) * separated;
    const depth = index * 3 + z;
    set(pane, {
      transform:"translate3d(" + x + "px," + y + "px," + depth + "px)",
      borderColor:"rgba(179,233,227," + .63 * separated + ")"
    });
    set(pane.querySelector(".badge"), { opacity:beat(time,2.02 + index * .47,.3) * (1 - beat(time,5.98,.34)) });
  });
  set(one("h1"), { opacity:beat(time,1.15,.4) * (1-beat(time,6.1,.48)) });
};
window.renderMotion(0);
</script>
</body>
</html>
