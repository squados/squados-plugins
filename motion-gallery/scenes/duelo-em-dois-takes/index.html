<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Duelo em Dois Takes</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/duelo.css">
<style>
main { width:1080px; height:1920px; padding:121px 62px; }
h1 { text-align:center; font-size:84px; }
.lane { position:relative; margin-top:58px; }
h2 { margin:0 0 20px; display:flex; align-items:center; gap:17px; font-size:38px; }
h2::before { content:""; width:18px; height:18px; border-radius:50%; background:var(--peach); box-shadow:0 0 30px #ffc38770; }
.second h2::before { background:var(--mint); box-shadow:0 0 30px #93e9cd70; }
.take { position:relative; width:956px; height:538px; border:1px solid #ffffff42; border-radius:26px; }
.first .take:empty::before { filter:sepia(.18); }
.second .take:empty::before { filter:hue-rotate(12deg); }
.result { position:absolute; bottom:32px; left:36px; padding:14px 20px; border-radius:12px; color:var(--peach); font-size:38px; }
.second .result { color:var(--mint); }
</style>
</head>
<body>
<main data-composition-id="duelo-em-dois-takes" data-start="0" data-duration="5" data-width="1080" data-height="1920">
<h1 class="duel-title"></h1>
<section class="lane first">
  <h2></h2>
  <div class="take"><!-- motion-media:first:0:5:0 --></div>
  <p class="result glass"></p>
</section>
<section class="lane second">
  <h2></h2>
  <div class="take"><!-- motion-media:second:0:5:1 --></div>
  <p class="result glass"></p>
</section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy("h1", "title", "Quem editou melhor?");
copy(".first h2", "firstName", "Agente Atlas");
copy(".second h2", "secondName", "Agente Órbita");
copy(".first p", "firstResult", "Edição com cortes");
copy(".second p", "secondResult", "Edição com legendas");
for (const [key, selector] of [["first", ".first"], ["second", ".second"]]) {
  one(selector + " p").hidden = Boolean(inputs[key]);
}
window.renderMotion = time => {
  all(".result").forEach((element, index) => {
    const visible = beat(time, .7 + .47 * index, .26);
    set(element, { opacity: visible, transform: "translateY(" + 18 * (1 - visible) + "px)" });
  });
};
window.renderMotion(0);
</script>
</body>
</html>
