<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Controles de Vidro</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main {background:radial-gradient(ellipse at 60% 43%,#1b4358,#182237 54%,#101321 94%);color:#f0fbff;}
main[data-transparent="true"] {background:transparent;}
.controls {position:absolute; inset:0; display:grid; align-content:center; justify-content:center; gap:18px;}
.controls[data-side="right"] {justify-content:end; padding-right:128px;}
.controls[data-side="left"] {justify-content:start; padding-left:128px;}
.glass {min-width:510px; border:1.5px solid #d4edfbb0; border-radius:26px; background:
 linear-gradient(162deg,#a9e4fe2d,#17304d99 51%,#0d1729dd),radial-gradient(ellipse at 94% 4%,#79b9ed48,transparent 62%);
 box-shadow:0 23px 54px #0b122985,inset 0 2px 0 #f5feff84,inset 0 -4px 19px #07152670;
 backdrop-filter:blur(16px); position:relative; overflow:hidden;}
.glass::after {content:""; position:absolute; inset:0; pointer-events:none; background:
 linear-gradient(113deg,transparent 20%,#d4f6ff25 43%,#f3fdff41 49%,transparent 64%); transform:translateX(var(--sweep,-110%));}
.button {display:grid; grid-template-columns:54px minmax(0,1fr) 36px; align-items:center;
 padding:24px 36px; column-gap:24px; width:551px;}
.button .icon {width:52px; height:52px; display:grid; place-items:center; color:#ccecff; font:44px/1 Arial,sans-serif;}
.button strong {display:block; font-size:34px; font-weight:665; line-height:1.16;}
.button small {display:block; font-size:24px; color:#bbd7e9; margin-top:3px;}
.arrow {width:32px; height:32px; color:#d6faff;}
.single {display:grid; align-items:center; grid-template-columns:1fr 39px; gap:24px; padding:28px 35px; font-size:37px;}
.metric {padding:40px 58px; min-width:725px;}
.value {display:block; text-align:center; font-size:118px; font-weight:720; letter-spacing:-.045em; color:#c5ffe8;}
.legend {border-top:1px solid #b9e9e861; display:flex; gap:42px; justify-content:space-between; padding-top:18px; font-size:31px;}
.legend > span {display:flex; align-items:center; gap:12px;}
.logo {width:52px;height:52px; display:grid;place-items:center;border-radius:12px;background:#d5f3ff19;color:#c5f1e4;}
.logo img {max-width:43px; max-height:43px;}
.play-action {position:relative; width:348px; height:112px; margin-top:100px; pointer-events:none;}
.play-glass {display:grid; place-items:center; width:100%; height:100%; min-width:0;
 border-color:#b9f6e68c; background:linear-gradient(164deg,#91e4cd52,#143f45dd 48%,#092327ee),
 radial-gradient(ellipse at 54% 0%,#b7fff24c,transparent 72%); color:#e4fff7;
 box-shadow:0 21px 46px #071b299e,inset 0 2px 0 #eefff478,inset 0 -4px 18px #061a2180;}
.play-icon {width:43px; height:43px; filter:drop-shadow(0 3px 7px #062827);}
.play-halo {position:absolute; width:54px; height:54px; left:calc(50% - 27px); top:calc(50% - 27px);
 border:1.5px solid #b8fff1; border-radius:50%; box-shadow:0 0 18px #a0ffe39c;}
.play-pointer {position:absolute; top:0; left:0; width:31px; height:38px;
 filter:drop-shadow(0 3px 5px #021319cc);}
.metric-details {width:788px;min-height:508px;padding:41px 50px;border-radius:47px;
 color:#f6f8fb;border:1.5px solid #dce4ef8f;background:linear-gradient(176deg,#d9e3ef29,#33383e66 40%,#171b209b),#2023286b;
 box-shadow:0 24px 62px #07080ca0,inset 0 1px #ffffff37;backdrop-filter:blur(16px);}
.metric-details .detail-heading {display:block;font-size:27px;color:#d4deeb}
.metric-details .value {text-align:left;color:#f5f8fa;font-size:102px;line-height:1.13;margin-bottom:16px}
.detail-row {display:flex;align-items:center;gap:17px;border-top:1px solid #cfdce459;padding:14px 0}
.detail-row small {display:block;color:#c1cedb;font-size:21px}.detail-row b {font-size:30px;font-weight:680}
.detail-row .logo {background:transparent}.detail-row em {font-style:normal;color:#d7e2ec;font-size:24px}
[hidden] {display:none!important;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="download" viewBox="0 0 30 30"><path d="M15 4v20M7 16l8 8 8-8" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<main data-composition-id="controles-de-vidro" data-start="0" data-duration="9" data-width="1920" data-height="1080">
<section class="controls">
 <div class="glass button"><div class="icon">⊞</div><div><strong class="action"></strong><small class="left"></small></div><svg class="arrow"><use href="#download"/></svg></div>
 <div class="glass button"><div class="icon">⌘</div><div><strong class="action"></strong><small class="right"></small></div><svg class="arrow"><use href="#download"/></svg></div>
 <div class="glass metric"><strong class="value"></strong><div class="legend"><span><span class="logo"><!-- motion-media:leftLogo:0:9:0 --></span><span class="left"></span></span>
 <span><span class="logo"><!-- motion-media:rightLogo:0:9:1 --></span><span class="right"></span></span></div></div>
 <div class="glass metric-details">
  <span class="detail-heading">Custo</span><strong class="value"></strong>
  <div class="detail-row"><span class="logo"><!-- motion-media:leftLogo:0:9:2 --></span><span><small>Modelo usado</small><b class="left"></b></span></div>
  <div class="detail-row"><span class="logo"><!-- motion-media:rightLogo:0:9:3 --></span><span><small>Ferramenta</small><b class="right"></b></span></div>
  <div class="detail-row"><span><small>Tempo de execução</small><b class="execution"></b></span><em class="rounds"></em></div>
 </div>
 <div class="glass single"><strong></strong><svg class="arrow"><use href="#download"/></svg></div>
 <div class="play-action">
  <div class="glass play-glass" role="img" aria-label="Reproduzir">
   <svg class="play-icon" viewBox="0 0 44 44" aria-hidden="true"><path d="M13 8.5a2.2 2.2 0 0 1 3.3-1.9l21 13.5a2.2 2.2 0 0 1 0 3.8l-21 13.5a2.2 2.2 0 0 1-3.3-1.9z" fill="currentColor"/></svg>
  </div>
  <div class="play-halo" aria-hidden="true"></div>
  <svg class="play-pointer" viewBox="0 0 31 38" aria-hidden="true"><path d="M2 2l24 19-11 1 5.2 11-5 2.4-5.2-11L2 31z" fill="#f8fffd" stroke="#10252a" stroke-width="1.7" stroke-linejoin="round"/></svg>
 </div>
</section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const mode = ["download","value","details","cta","play"].includes(inputs.mode) ? inputs.mode : "download";
const panels = {download:all(".button"),value:all(".metric"),details:all(".metric-details"),cta:all(".single"),play:all(".play-action")};
for (const [key,list] of Object.entries(panels)) for (const panel of list) panel.hidden = key !== mode;
stage.dataset.transparent = String(inputs.transparent === true);
const side = inputs.side ?? (mode === "play" ? "left" : "center");
one(".controls").dataset.side = side;
all(".action").forEach(node => node.textContent = inputs.label ?? "Download gratuito");
all(".left").forEach(node => node.textContent = inputs.left ?? "Windows");
all(".right").forEach(node => node.textContent = inputs.right ?? "macOS");
all('.value').forEach(node=>node.textContent=inputs.value??(mode==='details'?'US$ 12,74':'US$ 6,74'));
copy('.execution','execution','3h11m');copy('.rounds','rounds','3 rodadas de melhorias');
copy(".single strong","label","Materiais disponíveis");
for (const mark of all(".logo")) if (!mark.children.length) mark.textContent = "◈";

const playGlass = one(".play-glass");
const playHalo = one(".play-halo");
const playPointer = one(".play-pointer");
function cue(name, fallback, first, last) {
  const value = Number.isFinite(inputs[name]) ? inputs[name] : fallback;
  return Math.min(last, Math.max(first, value));
}
const clickAt = cue("clickAt", 2.91, .75, 6.25);
const dragAt = cue("dragAt", 4.32, clickAt + .42, 6.95);
const enterAt = cue("enterAt", 5.46, dragAt + .60, 7.65);

function renderPlay(time) {
  const reveal = spring(time, .12, .66);
  const exit = flow(phase(time, 8.38, .50));
  const click = flow(phase(time, clickAt - .08, .08)) * (1 - flow(phase(time, clickAt, .20)));
  const travel = flow(phase(time, dragAt, enterAt - dragAt));
  const landing = phase(time, enterAt, .62);
  const rebound = Math.sin(landing * Math.PI * 2.25) * (1 - landing) ** 2;
  const arc = Math.sin(travel * Math.PI);
  const x = (side === "right" ? -1120 : side === "left" ? 1120 : 475) * travel;
  const y = 58 * (1 - reveal) + 83 * arc - 62 * rebound - 22 * exit;
  const angle = (side === "right" ? -4 : 4) * arc;
  const scale = .92 + .08 * reveal - .09 * click + .035 * arc + .13 * rebound;
  set(playGlass, {opacity:clamp(reveal) * (1 - exit),
    transform:`translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale})`});
  const sweep = phase(time, enterAt, .58);
  playGlass.style.setProperty("--sweep", `${-115 + 235 * sweep}%`);

  const ring = phase(time, clickAt, .46);
  set(playHalo, {opacity:time < clickAt ? 0 : .90 * (1 - ring) ** 2,
    transform:`translate(${x}px,${y}px) scale(${.68 + 1.18 * ring})`});

  const approach = flow(phase(time, clickAt - .59, .59));
  const leave = flow(phase(time, enterAt + .16, .39));
  const cursorX = x + 172 + 126 * (1 - approach) + 74 * leave;
  const cursorY = y + 54 + 90 * (1 - approach) + 81 * leave;
  set(playPointer, {opacity:phase(time, clickAt - .62, .22) * (1 - leave),
    transform:`translate(${cursorX}px,${cursorY}px)`});
}

window.renderMotion = time => {
  if (mode === "play") {
    renderPlay(time);
    return;
  }
  panels[mode].forEach((panel,index) => {
    const at = .12+index*.13;
    const p = spring(time,at,.70);
    const exit = flow(phase(time,8.35,.5));
    const sweep = phase(time,at+.37,1.02);
    set(panel,{opacity:clamp(p)*(1-exit),
      transform:`translateY(${(1-p)*67-31*exit}px) scale(${.94+.06*p-.025*exit})`});
    panel.style.setProperty("--sweep", (-115+235*sweep)+"%");
  });
  if (mode==="cta") one(".single .arrow").style.transform = `translateY(${3*Math.sin(time*6)}px)`;
};
window.renderMotion(0);
</script></body></html>
