<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Câmera Encaixa na Moldura</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/duelo.css">
<style>
.take { inset:0; transform-origin:50% 50%; z-index:2; }
.take:empty::before { background-position:50% 28%; }
.canvas { position:absolute; inset:0; background:radial-gradient(ellipse at 28% 55%, #3e3a43, transparent 62%); }
[data-layout="papel"] .canvas { background:linear-gradient(125deg,#f2ecdc,#e4d7be); }
.panel { position:absolute; top:212px; left:130px; width:800px; }
[data-layout="papel"] .panel { color:#242a29; }
[data-layout="papel"] .duel-tag { color:#23735e; }
.panel h1 { margin:20px 0 28px; }
.panel p:last-child { font-size:43px; max-width:690px; }
.panel svg { width:170px; height:170px; margin-bottom:30px; color:#74bdad; }
.frame { position:absolute; inset:0; pointer-events:none; z-index:3; }
</style>
</head>
<body>
<main data-composition-id="camera-encaixa-na-moldura" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="canvas"></div>
<section class="panel">
  <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 17h55a8 8 0 0 1 8 8v41a8 8 0 0 1-8 8H43L22 89V74h-4a8 8 0 0 1-8-8V25a8 8 0 0 1 8-8Z" fill="none" stroke="currentColor" stroke-width="4"/><path d="M27 38h37M27 53h24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="78" cy="23" r="16" fill="#93e9cd" stroke="#1b1b20" stroke-width="3"/></svg>
  <p class="duel-tag"></p><h1 class="duel-title"></h1><p></p>
</section>
<div class="take" data-layout-allow-overflow><!-- motion-media:presenter:0:6:0 --></div>
<div class="frame"></div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
stage.dataset.layout = inputs.layout === "papel" ? "papel" : "vidro";
copy(".panel .duel-tag","label","Demonstração");
copy(".panel h1","title","O agente pede contexto.");
copy(".panel p:last-child","detail","Uma pergunta de cada vez.");
const take = one(".take");
const frame = one(".frame");
window.renderMotion = time => {
  const dock = flow(phase(time,.58,.84)) * (1-flow(phase(time,4.98,.72)));
  const scale = mix(1,.72,dock);
  const dx = 412 * dock;
  const sideCrop = 25 * dock;
  const edge = 8 * dock;
  const radius = 35 * dock;
  const transform = "translateX(" + dx + "px) scale(" + scale + ")";
  set(take, { clipPath:"inset(" + edge + "% " + sideCrop + "% round " + radius + "px)", transform });
  set(frame, {
    left:sideCrop+"%", right:sideCrop+"%", top:edge+"%", bottom:edge+"%",
    transformOrigin:"50% 50%", transform,
    borderRadius:radius+"px", border:"3px solid #f3e2cf88", opacity:dock
  });
  const show = beat(time,1.25,.4) * (1-beat(time,4.67,.4));
  set(one(".panel"),{ opacity:show, transform:"translateX(" + mix(-50,0,show) + "px)" });
};
window.renderMotion(0);
</script>
</body>
</html>
