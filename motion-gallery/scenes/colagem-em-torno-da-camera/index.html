<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background: radial-gradient(ellipse at 50% 42%, #1c1c1e, #0e0e10 48%, #060607 90%); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .24; mix-blend-mode: soft-light; }
.tiles { position: absolute; inset: 0; perspective: 1800px; }
.print { position: absolute; left: -225px; top: -127px; width: 450px; height: 254px; background: #d6d5cf; }
.print .photo { position: absolute; inset: var(--mat, 0px); background-image: var(--atlas, var(--image)); background-size: 300% auto; border-radius: 1px; }
.print .photo[data-image] { background-size: cover; background-position: center; }
.camera { position: absolute; left: 588px; top: 95px; width: 744px; height: 890px; overflow: hidden; border-radius: 7px; background: #131315; }
.camera img, .camera video { width: 100%; height: 100%; object-fit: cover; object-position: 51% center; }
</style>
</head>
<body>
<main data-composition-id="colagem-em-torno-da-camera" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
<svg class="grain" width="1920" height="1080" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="41"/></filter><rect width="100%" height="100%" filter="url(#noise)"/></svg>
<div class="camera">
  <!-- motion-media:presenter:2.64:4.16:0 -->
</div>
<div class="tiles"></div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const places = ["marinha", "douro", "sintra", "lagos"];
photos(".tiles", inputs.sheet ? 6 : places.length);
const prints = all(".tiles .photo").map((photo, index) => {
  if (!inputs.sheet) {
    photo.dataset.image = places[index];
    photo.style.setProperty("--image", "url(art/" + places[index] + ".webp)");
  } else {
    photo.style.setProperty("--py", index < 3 ? "15.21739%" : "84.78261%");
  }
  const print = document.createElement("div");
  print.className = "print";
  photo.before(print);
  print.append(photo);
  return print;
});
const center = [960, 540, 0, 0, 0, 1920 / 450];
const stack = [[904, 443, -43, -6, -4, 1], [721, 582, 16, -13, 15, 1.05], [1162, 373, 34, 10, -17, 1], [1209, 601, 72, -8, -13, 1.04], [782, 681, -14, 8, 11, .91], [1139, 714, 45, 8, -16, .93]];
const sides = inputs.sheet
  ? [[308, 258, 0, -5, 10, 1], [304, 540, 0, 4, 10, 1], [1608, 258, 0, 6, -11, 1], [1613, 540, 0, -4, -10, 1], [308, 822, 0, -4, 10, 1], [1612, 822, 0, 4, -11, 1]]
  : [[308, 372, 0, -5, 10, 1], [304, 704, 0, 4, 10, 1], [1608, 368, 0, 6, -11, 1], [1613, 706, 0, -4, -10, 1]];
const take = one(".camera");
const beforeStack = [[760, 515], [1275, 463], [1331, 661], [830, 731], [1126, 779]];
window.renderMotion = time => {
  const open = flow(phase(time, 2.64, .58));
  set(take, { opacity: snap(time, 2.68, .22), clipPath: "inset(0 " + 24 * (1 - open) + "% round 7px)" });
  prints.forEach((print, index) => {
    const start = index === 0 ? .14 : .81 + (index - 1) * .16;
    const entry = index === 0 ? beat(time, start, .61) : spring(time, start, .36);
    const exit = snap(time, 2.40 + index * .043, 1.00);
    const seat = spring(time, 2.62 + index * .043, .54);
    const origin = index === 0 ? center : [...beforeStack[index - 1], -110, 0, 0, .76];
    const [x, y, depth, angle, pitch, scale] = stack[index].map((value, axis) =>
      mix(mix(origin[axis], value, entry), sides[index][axis], axis === 0 ? exit : seat)
    );
    const mat = index === 0 ? flow(phase(time, .26, .43)) : 1;
    print.style.setProperty("--mat", 7 * mat + "px");
    set(print, {
      opacity: index === 0 ? 1 : snap(time, start, .22),
      zIndex: index + 1,
      borderRadius: 2 * mat + "px",
      boxShadow: "0 28px 56px rgba(0,0,0," + .65 * mat + ")",
      transform: "translate3d(" + x + "px," + y + "px," + depth + "px) rotateY(" + pitch + "deg) rotateZ(" + angle + "deg) scale(" + scale + ")"
    });
  });
};
window.renderMotion(0);
</script>
</body>
</html>
