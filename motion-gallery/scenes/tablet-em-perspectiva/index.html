<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Tablet em Perspectiva</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/edicao-reutilizavel.css">
</head><body>
<main data-variant="tablet" data-composition-id="tablet-em-perspectiva" data-start="0" data-duration="4" data-width="1920" data-height="1080"><div class="device"><div class="display"><!-- motion-media:media:0:4:0 --><strong>ESTÚDIO<br>EM MOVIMENTO</strong></div></div></main>
<script src="../motion-assets/edicao-reutilizavel.js"></script><script>
for (const node of document.querySelectorAll('img,video')) {
  node.style.position='absolute';node.style.inset='0';
  if (node.parentElement.matches('.lens,.display,.demo-screen')) {
    for (const child of node.parentElement.children) if(child!==node && !child.matches('video,img')) child.hidden=true;
  }
}
</script>
</body></html>
