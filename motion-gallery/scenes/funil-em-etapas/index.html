<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Funil em Etapas</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { background:#eaf1e9; color:#173429; }
main::before { content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 77% 74%,#c9e8d9,transparent 62%); z-index:-1; }
.paper-rule { position:absolute; left:117px; right:117px; top:106px; height:1px; background:#1734293b; }
.intro { position:absolute; left:117px; top:154px; width:540px; }
.kicker { font-size:23px; font-weight:650; letter-spacing:.15em; text-transform:uppercase; }
h1 { margin-top:22px; font-size:96px; }
.conclusion { margin-top:37px; max-width:485px; font-size:33px; line-height:1.19; color:#43665a; }
.readout { position:absolute; left:117px; top:749px; border-top:1px solid #1734293b; width:425px; padding-top:19px; }
.readout strong { display:block; font-size:119px; font-weight:620; letter-spacing:-.08em; line-height:1; font-variant-numeric:tabular-nums; }
.readout span { font-size:28px; color:#43665a; }
svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.rail { stroke:#183b3025; stroke-width:2; stroke-dasharray:3 12; }
.tier { fill:var(--color); }
.connector { fill:#377e6535; }
.name { font-size:27px; font-weight:650; fill:#173429; }
.value { font-size:34px; font-weight:650; fill:#173429; font-variant-numeric:tabular-nums; }
.delta { font-size:24px; fill:#42665b; }
.measure { fill:#42665b; font-size:21px; letter-spacing:.10em; }
</style>
</head>
<body>
<main data-composition-id="funil-em-etapas" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="paper-rule"></div>
  <header class="intro"><p class="kicker">Conversão por etapa</p><h1 class="display"></h1><p class="conclusion"></p></header>
  <div class="readout"><strong></strong><span>do volume inicial</span></div>
  <svg viewBox="0 0 1920 1080" aria-label="Funil com volume e variação a cada etapa">
    <line x1="1225" x2="1225" y1="177" y2="973" class="rail"/>
    <text x="1607" y="181" class="measure">VOLUME</text>
    <g class="connectors"></g><g class="tiers"></g>
  </svg>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy("h1","title","Da visita à compra");
copy(".conclusion","conclusion", inputs.stages ? "" : "A maior queda acontece antes do cadastro.");
const fallback = [
  { label:"Visitas", value:2400 }, { label:"Cadastros", value:1020 },
  { label:"Testes", value:620 }, { label:"Compras", value:372 },
];
const supplied = Array.isArray(inputs.stages) ? inputs.stages.filter(item =>
  typeof item?.label === "string" && item.label.trim() && Number.isFinite(item.value) && item.value >= 0).slice(0,6) : [];
const stages = supplied.length >= 2 ? supplied : fallback;
const scale = Math.max(...stages.map(item => item.value), 1);
const unit = typeof inputs.unit === "string" && inputs.unit.trim() ? " " + inputs.unit.trim() : "";
const format = new Intl.NumberFormat("pt-BR", { maximumFractionDigits:1 });
const ratio = new Intl.NumberFormat("pt-BR", { style:"percent", maximumFractionDigits:1 });
const colors = ["#87d8b6","#6bc8a3","#55b593","#409f80","#318a70","#217b61"];
const svgNamespace = "http://www.w3.org/2000/svg";
function draw(parent, name, attributes, value) {
  const node = document.createElementNS(svgNamespace,name);
  Object.entries(attributes).forEach(([key, attr]) => node.setAttribute(key, attr));
  if (value !== undefined) node.textContent = value;
  parent.append(node);
  return node;
}
const center = 1225;
const stride = Math.min(172, 700 / stages.length);
const rows = stages.map(({label,value}, index) => {
  const y = 221 + index * stride;
  const width = value / scale * 718;
  const group = draw(one(".tiers"),"g",{});
  const tier = draw(group,"rect",{ class:"tier", y:y+47, height:29, rx:14.5 });
  tier.style.setProperty("--color",colors[index]);
  draw(group,"text",{ class:"name", x:center, y:y+30, "text-anchor":"middle" },label);
  const amount = draw(group,"text",{ class:"value", x:1607, y:y+40 });
  const difference = value - (stages[index-1]?.value ?? value);
  if (index) {
    const prefix = difference > 0 ? "+" : difference < 0 ? "−" : "";
    draw(group,"text",{ class:"delta", x:1607, y:y+73 },prefix + format.format(Math.abs(difference)) + " na etapa");
  }
  const connector = index ? draw(one(".connectors"),"polygon",{ class:"connector" }) : null;
  return { amount, connector, group, tier, value, width, y };
});
window.renderMotion = time => {
  const intro = beat(time,.06,.5);
  set(one(".intro"),{ opacity:intro, transform:"translateY(" + 26 * (1-intro) + "px)" });
  one(".conclusion").style.opacity = beat(time,5.35,.55);
  const strideTime = 3.9 / rows.length;
  rows.forEach(({amount,connector,group,tier,value,width,y}, index) => {
    const start = .72 + index * strideTime;
    const visible = beat(time,start,.35);
    const drawn = flow(phase(time,start,.83));
    const half = width * drawn / 2;
    group.style.opacity = visible;
    tier.setAttribute("x",center-half);
    tier.setAttribute("width",half*2);
    amount.textContent = format.format(value*drawn) + unit;
    if (connector) {
      const prior = rows[index-1];
      const upper = prior.width / 2;
      connector.setAttribute("points",[
        [center-upper,prior.y+75],[center+upper,prior.y+75],[center+half,y+60],[center-half,y+60],
      ].map(point => point.join(",")).join(" "));
      connector.style.opacity = drawn;
    }
  });
  const final = flow(phase(time,5.08,.72));
  const first = stages[0].value;
  one(".readout strong").textContent = first ? ratio.format(stages.at(-1).value / first * final) : "—";
  set(one(".readout"),{ opacity:beat(time,5.08,.25), transform:"translateY(" + 18 * (1-final) + "px)" });
};
window.renderMotion(0);
</script>
</body>
</html>
