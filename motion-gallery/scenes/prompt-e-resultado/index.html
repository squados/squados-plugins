
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prompt e Resultado</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/amber.css">
<style>
main.amber { background: radial-gradient(ellipse at 52% 94%,#41231c,#171318 55%,#101014 80%); }
.workbench { position: absolute; inset: 92px 158px 94px; display: grid; grid-template-rows: 211px 1fr; gap: 19px; }
.prompt, .output {
  min-height: 0; border-radius: 26px; overflow: hidden;
  box-shadow: 0 22px 74px #080609a0, inset 0 1px #fff2;
}
.prompt { background: linear-gradient(145deg,#30282e,#1c191f); border: 1px solid #f3c3ad50; padding: 25px 32px 28px; }
.prompt header, .output header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.prompt header { margin-bottom: 19px; }
.bead { display: flex; align-items: center; gap: 9px; color: #ffd0b5; font-size: 20px; letter-spacing: .10em; text-transform: uppercase; }
.bead i { width: 10px; height: 10px; border-radius: 50%; background: #ff9366; box-shadow: 0 0 15px #ff844ec9; }
.prompt header small { font-size: 19px; letter-spacing: .06em; color: #d6a99a; }
.field { display: grid; grid-template-columns: 1fr 61px; gap: 12px; align-items: center; min-height: 104px; border-radius: 17px; background: #100e13ba; border: 1px solid #b8a0ab55; padding: 16px 17px 16px 25px; }
.command { font-size: 37px; font-weight: 510; color: #fff5ef; line-height: 1.13; overflow-wrap: anywhere; }
.caret { display: inline-block; width: 3px; height: .94em; vertical-align: -.1em; background: #ffaf7e; margin-left: 5px; box-shadow: 0 0 12px #ff8f52; }
.send { width: 56px; height: 56px; display: grid; place-items: center; background: linear-gradient(145deg,#ffb78e,#ff855b); color: #321716; border-radius: 14px; box-shadow: 0 0 24px #ff875140,inset 0 1px #fff7; }
.send svg { width: 28px; height: 28px; }
.output { position: relative; display: grid; grid-template-rows: 69px 1fr; background: #f9f2e9; color: #27222b; border: 1px solid #fbe1ca; }
.output header { padding: 0 31px; border-bottom: 1px solid #c3afad66; background: linear-gradient(90deg,#fff6ed,#efe7e4); }
.output header b { font-size: 26px; font-weight: 660; }
.status { font-size: 19px; display: flex; gap: 11px; align-items: center; color: #794b3e; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: #c56844; box-shadow: 0 0 0 4px #dd885731; }
.status.done { color: #256349; }
.status.done i { background: #2b9161; box-shadow: 0 0 0 4px #39976023; }
.progress { position: absolute; height: 3px; top: 67px; left: 0; right: 0; background: linear-gradient(90deg,#b75c42,#ffae73); transform-origin: left; }
.output-body { min-height: 0; display: grid; grid-template-columns: 260px minmax(0,1fr); }
.sidebar { background: #ede3de; border-right: 1px solid #c5b3ae77; padding: 29px 18px; }
.sidebar small { font-size: 19px; color: #6c5353; letter-spacing: .09em; margin-left: 13px; text-transform: uppercase; }
.sidebar ol { list-style: none; padding: 0; margin-top: 19px; display: grid; gap: 10px; }
.sidebar li { display: flex; align-items: center; gap: 9px; min-height: 48px; border-radius: 9px; padding: 9px 12px; font-size: 22px; color: #675660; line-height: 1.05; }
.sidebar li i { font-style: normal; color: #6e3c32; font-size: 16px; }
.sidebar li.active { background: #ddc7be; color: #422b2e; font-weight: 600; }
.screen { position: relative; overflow: hidden; min-height: 0; min-width: 0; background: #fcf7f0; }
.screen > :is(video,img) { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #17151c; }
.board { position: absolute; inset: 35px 38px; display: grid; grid-template-rows: auto auto 1fr; gap: 18px; }
.board h2 { font-size: 39px; font-weight: 650; letter-spacing: -.03em; }
.board h2 small { font-size: 20px; color: #785d58; display: block; font-weight: 480; letter-spacing: 0; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 11px; }
.stat { background: #f0e4db; border: 1px solid #d7c3ba; border-radius: 12px; min-height: 94px; padding: 12px 17px; color: #5d3c3b; }
.stat b { display: block; font-size: 33px; font-weight: 680; line-height: 1; margin-bottom: 6px; }
.stat span { font-size: 18px; }
.table { border: 1px solid #d5c0b9; border-radius: 15px; overflow: hidden; align-self: start; }
.line { display: grid; align-items: center; grid-template-columns: 1.5fr 1fr .65fr; gap: 20px; padding: 0 21px; min-height: 61px; font-size: 26px; }
.line + .line { border-top: 1px solid #ddcbc2; }
.line.head { min-height: 44px; background: #f0e5dd; font-size: 17px; text-transform: uppercase; letter-spacing: .09em; color: #745a58; }
.line strong { font-size: 25px; font-weight: 640; }
.line span:last-child { justify-self: start; border: 1px solid #b1bd9d; border-radius: 40px; padding: 3px 14px; background: #e6ecdd; color: #34543e; font-size: 19px; }
.line.critical span:last-child { background: #f5dfce; border-color: #dd9b7d; color: #874331; }
.line.head span:last-child { border: none; padding: 0; background: none; font-size: inherit; color: inherit; }
</style>
</head>
<body>
<main class="amber" data-composition-id="prompt-e-resultado" data-start="0" data-duration="8.6" data-width="1920" data-height="1080">
  <div class="aurora" aria-hidden="true"></div>
  <div class="workbench">
    <section class="prompt">
      <header><span class="bead"><i></i> Solicitação</span><small>Área de trabalho</small></header>
      <div class="field"><p class="command"><span class="written"></span><span class="caret"></span></p>
        <span class="send"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 23V5m-7 7 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
      </div>
    </section>
    <section class="output">
      <header><b class="output-title"></b><span class="status"><i></i><span></span></span></header>
      <span class="progress" aria-hidden="true"></span>
      <div class="output-body">
        <aside class="sidebar"><small>Etapas</small><ol></ol></aside>
        <div class="screen">
          <!-- motion-media:screen:2.12:6.48:0:revealAt -->
          <section class="board">
            <h2 class="result-title">Triagem de solicitações<small>Exemplo ilustrativo</small></h2>
            <div class="stats"><div class="stat"><b>3</b><span>Chamados</span></div><div class="stat"><b>3</b><span>Equipes</span></div><div class="stat"><b>1</b><span>Prioridade alta</span></div></div>
            <div class="table"><div class="line head"><span>Solicitação</span><span>Responsável</span><span>Prioridade</span></div></div>
          </section>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const prompt = Array.from(inputs.prompt ?? "Organize os chamados, identifique a prioridade e encaminhe cada um para a equipe certa.");
const steps = Array.isArray(inputs.steps) && inputs.steps.length ? inputs.steps.slice(0, 5) : ["Ler chamados", "Classificar", "Distribuir"];
const result = [
  ["Erro ao emitir nota fiscal", "Financeiro", "Alta"],
  ["Solicitação de novo acesso", "Operações", "Média"],
  ["Dúvida sobre integração", "Produto", "Normal"]
];
const reveal = Number.isFinite(inputs.revealAt) ? Math.max(0, Math.min(8.5, inputs.revealAt)) : 2.12;
copy(".output-title", "outputTitle", "Resultado");
one(".command").style.fontSize = Math.max(22, Math.min(37, 37 * (135 / Math.max(135, prompt.length)))) + "px";
const stepsNodes = steps.map((name, i) => {
  const step = document.createElement("li");
  const index = document.createElement("i");
  index.textContent = String(i + 1).padStart(2, "0");
  step.append(index, document.createTextNode(name));
  one(".sidebar ol").append(step);
  return step;
});
const rows = result.map((values, row) => {
  const line = document.createElement("div");
  line.className = row === 0 ? "line critical" : "line";
  values.forEach((value, index) => {
    const cell = document.createElement(index === 0 ? "strong" : "span");
    cell.textContent = value;
    line.append(cell);
  });
  one(".table").append(line);
  return line;
});
const suppliedMedia = one(".screen > :is(img, video)");
one(".board").hidden = Boolean(suppliedMedia);
if (suppliedMedia) one(".board").style.display = "none";
const written = one(".written");
const status = one(".status");
window.renderMotion = time => {
  const promptIn = beat(time, .09, .55);
  const type = phase(time, Math.min(.40, reveal / 4), Math.max(.05, reveal * .81 - .35));
  written.textContent = prompt.slice(0, Math.ceil(prompt.length * type)).join("");
  one(".caret").style.opacity = time > reveal ? 0 : (Math.sin(time * 15) > 0 ? 1 : .25) * promptIn;
  set(one(".prompt"), { opacity: promptIn, transform: "translateY(" + (1 - promptIn) * 28 + "px)" });
  one(".send").style.transform = "scale(" + (1 - .15 * Math.sin(Math.PI * phase(time, reveal - .22, .35))) + ")";
  const panel = flow(phase(time, reveal - .10, .65));
  const screenDuration = suppliedMedia?.duration;
  const done = suppliedMedia instanceof HTMLVideoElement
    ? Math.min(8.24, reveal + (Number.isFinite(screenDuration) ? screenDuration : 8.6) - .26)
    : reveal + 2.74;
  const work = flow(phase(time, reveal + .28, Math.max(.1, done - reveal - .28)));
  set(one(".output"), { opacity: panel, clipPath: "inset(0 0 " + (1 - panel) * 100 + "% 0 round 26px)", transform: "translateY(" + (1 - panel) * -18 + "px)" });
  one(".progress").style.transform = "scaleX(" + work + ")";
  status.classList.toggle("done", work === 1);
  status.lastElementChild.textContent = work === 1 ? "Concluído" : "Processando";
  stepsNodes.forEach((step, i) => {
    step.classList.toggle("active", i === Math.min(stepsNodes.length - 1, Math.floor(work * stepsNodes.length)));
  });
  all(".stat").forEach((stat, i) => {
    const p = beat(time, reveal + .59 + .13 * i, .36);
    set(stat, { opacity: p, transform: "translateY(" + (1 - p) * 9 + "px)" });
  });
  rows.forEach((row, i) => {
    const p = beat(time, reveal + .81 + .56 * i, .43);
    set(row, { opacity: p, transform: "translateY(" + (1 - p) * 15 + "px)" });
  });
  if (suppliedMedia) suppliedMedia.style.opacity = beat(time, reveal, .34);
};
window.renderMotion(0);
</script>
</body>
</html>
