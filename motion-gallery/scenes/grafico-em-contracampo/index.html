<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gráfico em Contracampo</title>
<style>
  * { box-sizing:border-box }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden }
  #stage {
    --paper:#f6f6f1; --ink:#151a20; --muted:#515b63; --rule:#cbd1d0; --accent:#6245b6;
    position:relative; width:1920px; height:1080px; overflow:hidden;
    background:var(--paper); color:var(--ink); font-family:"Segoe UI",Arial,sans-serif;
  }
  #chart {
    position:absolute; top:0; left:828px; width:1092px; height:1080px;
    padding:78px 66px 58px; background:var(--paper);
  }
  #chart::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:linear-gradient(#34414d08 1px,transparent 1px),linear-gradient(90deg,#34414d08 1px,transparent 1px);
    background-size:40px 40px;
  }
  #chart > * { position:relative }
  #kicker { color:var(--muted); font:600 22px/1.25 Consolas,monospace; letter-spacing:.12em; text-transform:uppercase }
  h1 { margin:12px 0 17px; font:650 76px/1 "Bahnschrift","Segoe UI",sans-serif; letter-spacing:-.055em; }
  #legend { display:flex; align-items:center; gap:36px; color:var(--ink); font-size:27px; font-weight:540 }
  #legend span { display:inline-flex; align-items:center; gap:12px; }
  #legend span::before { content:""; display:block; width:39px; height:5px; border-radius:6px; background:var(--ink) }
  #legend span:first-child::before { background:var(--accent) }
  #plot { display:block; width:960px; height:609px; margin-top:29px; overflow:visible; }
  #plot text { fill:var(--muted); font:23px Consolas,monospace; }
  #plot .grid { stroke:var(--rule); stroke-width:1.5; }
  #plot .baseline { stroke:#75808b; stroke-width:2; }
  #plot .curve { fill:none; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
  #plot .curve.first { stroke:var(--accent) }
  #plot .curve.second { stroke:var(--ink) }
  #note { margin:10px 0 0 55px; color:var(--muted); font:20px/1.3 Consolas,monospace; }
  #speaker { position:absolute; z-index:2; inset:0 auto 0 0; width:828px; overflow:hidden; background:#f0f1f1; }
  #speaker > img,#speaker > video { display:block; width:100%; height:100%; object-fit:cover; object-position:44% 48%; }
  #speaker > img { filter:contrast(.98) saturate(.89); }
  #speaker::after { content:""; position:absolute; inset:0; border-inline:1px solid #0c142017; pointer-events:none; }
</style>
</head>
<body>
<main id="stage" data-composition-id="grafico-em-contracampo" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
  <section id="chart" aria-label="Gráfico de comparação">
    <div id="kicker">EVOLUÇÃO POR SEMANA</div>
    <h1 id="headline"></h1>
    <div id="legend"><span id="legend-a"></span><span id="legend-b"></span></div>
    <svg id="plot" viewBox="0 0 960 609" aria-hidden="true"></svg>
    <p id="note"></p>
  </section>
  <div id="speaker">
    <!-- motion-media:presenter:0:6.8:0 -->
  </div>
</main>
<script>
  const inputs = window.motionInputs ?? {}
  const chart = document.getElementById('chart')
  const speaker = document.getElementById('speaker')
  const plot = document.getElementById('plot')
  const header = document.getElementById('headline')
  const legend = document.getElementById('legend')
  const illustration = [[19, 27, 36, 49, 55, 76], [17, 22, 25, 34, 39, 49]]
  const series = inputs.series ?? illustration
  if (!Array.isArray(series) || series.length !== 2 || series.some(row =>
    !Array.isArray(row) || row.length !== series[0].length || row.length < 2 || row.length > 6 ||
    row.some(value => !Number.isFinite(value) || value < 0 || value > 100)
  )) throw Error('Forneça duas séries de 2 a 6 valores de 0 a 100, com o mesmo tamanho.')

  const labels = inputs.axisLabels ?? series[0].map((_, index) => 'S' + (index + 1))
  if (!Array.isArray(labels) || labels.length !== series[0].length ||
    labels.some(label => typeof label !== 'string' || label.length > 10)
  ) throw Error('Forneça uma legenda curta para cada ponto do eixo X.')

  header.textContent = inputs.title ?? 'Prática e progresso'
  if (header.getBoundingClientRect().height > 80) header.style.fontSize = '61px'
  document.getElementById('legend-a').textContent = inputs.labelA ?? 'Prática guiada'
  document.getElementById('legend-b').textContent = inputs.labelB ?? 'Prática livre'
  document.getElementById('note').textContent = inputs.note ?? 'Pontuação em uma escala de 0 a 100 · Dados ilustrativos'
  if (/^#[\da-f]{6}$/i.test(inputs.accent)) document.getElementById('stage').style.setProperty('--accent', inputs.accent)

  function svg(tag, attrs, text) {
    const item = document.createElementNS('http://www.w3.org/2000/svg', tag)
    for (const [key, value] of Object.entries(attrs)) item.setAttribute(key, value)
    if (text !== undefined) item.textContent = text
    plot.append(item)
    return item
  }

  const bottom = 542
  const x = index => 70 + 860 * index / (labels.length - 1)
  const y = value => bottom - 512 * value / 100
  for (let value = 0; value <= 100; value += 20) {
    const row = y(value)
    svg('line', { x1: 70, x2: 930, y1: row, y2: row, class: value === 0 ? 'baseline' : 'grid' })
    svg('text', { x: 48, y: row + 7, 'text-anchor': 'end' }, value)
  }
  for (let i = 0; i < labels.length; i++) {
    svg('text', { x: x(i), y: bottom + 47, 'text-anchor': 'middle' }, labels[i])
  }
  const curves = series.map((row, seriesIndex) => {
    const points = row.map((value, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(value)).join(' ')
    const line = svg('path', { d: points, class: 'curve ' + (seriesIndex ? 'second' : 'first'), pathLength: 100 })
    line.style.strokeDasharray = '100 100'
    return line
  })

  const clamp = value => Math.max(0, Math.min(1, value))
  const progress = (time, start, end) => clamp((time - start) / (end - start))
  const ease = value => value < .5 ? 4 * value ** 3 : 1 - (-2 * value + 2) ** 3 / 2

  window.renderMotion = time => {
    const exchange = ease(progress(time, 1.93, 2.48)) - ease(progress(time, 4.51, 5.06))
    chart.style.transform = 'translateX(' + (-828 * exchange) + 'px)'
    speaker.style.transform = 'translateX(' + (1092 * exchange) + 'px)'
    header.style.opacity = String(progress(time, .12, .39))
    legend.style.opacity = String(progress(time, .22, .48))
    const first = progress(time, .35, 1.56)
    const second = progress(time, 2.64, 3.78)
    for (const [index, value] of [first, second].entries()) {
      curves[index].style.strokeDashoffset = String(100 * (1 - value))
      curves[index].style.opacity = value ? '1' : '0'
    }
  }
  window.renderMotion(0)
</script>
</body>
</html>
