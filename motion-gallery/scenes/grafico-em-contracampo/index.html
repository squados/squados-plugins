<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gráfico em Contracampo</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
  * { box-sizing:border-box }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden }
  #stage {
    --ink:#f4f6fd; --muted:#c4cedd; --rule:#c3d6ef45; --accent:#a9caff;
    position:relative; width:1920px; height:1080px; overflow:hidden;
    color:var(--ink); font:500 44px/1.15 Outfit,sans-serif;
  }
  #speaker { position:absolute; inset:0; overflow:hidden; }
  #speaker > :is(img,video) { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 44%; transform-origin:50% 0; }
  #chart {
    position:absolute; top:50%; left:1030px; width:785px; padding:50px 53px 56px;
    display:flex; flex-direction:column; justify-content:center; border-radius:34px;
    background:linear-gradient(150deg,#202936a6,#121925cb); backdrop-filter:blur(24px) saturate(.78);
    border:1px solid #dceaff68; box-shadow:0 30px 70px #0005,inset 0 1px #edf4ff23;
  }
  h1 { margin:0 0 58px; font:680 69px/1.04 Outfit,sans-serif; letter-spacing:-.045em; }
  #bars { display:grid; gap:42px; }
  .bar-row { display:grid; gap:15px; }
  .bar-label { display:flex; justify-content:space-between; align-items:baseline; gap:24px; min-height:59px; }
  .bar-label strong { font-size:57px; font-weight:630; line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; }
  .bar { height:19px; border-radius:12px; background:var(--ink); transform-origin:left; }
  .bar-row:nth-child(2) .bar { background:var(--accent); }
  #series { display:none; }
  .legacy h1 { margin-bottom:23px; font-size:61px; }
  .legacy #bars { display:none; }
  .legacy #series { display:block; }
  #legend { display:flex; gap:32px; font-size:29px; margin:0 0 13px; }
  #legend span:last-child { color:var(--accent); }
  #plot { display:block; width:100%; overflow:visible; }
  #plot text { fill:var(--muted); font:34px Outfit,sans-serif; }
  #plot .grid { stroke:var(--rule); stroke-width:1.5; }
  #plot .curve { fill:none; stroke:var(--ink); stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
  #plot .curve.second { stroke:var(--accent); }
  #note { margin:14px 0 0 49px; color:var(--muted); font-size:27px; }
</style>
</head>
<body>
<main id="stage" data-composition-id="grafico-em-contracampo" data-start="0" data-duration="6.8" data-width="1920" data-height="1080">
  <div id="speaker">
    <!-- motion-media:presenter:0:6.8:0 -->
  </div>
  <section id="chart" aria-label="Gráfico de comparação">
    <h1 id="headline"></h1>
    <div id="bars"></div>
    <div id="series">
      <div id="legend"><span></span><span></span></div>
      <svg id="plot" viewBox="0 0 916 500" aria-hidden="true"></svg>
      <p id="note" hidden></p>
    </div>
  </section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
  const chart = document.getElementById('chart')
  const camera = document.querySelector('#speaker > :is(img,video)')
  const header = document.getElementById('headline')
  const legacy = Object.hasOwn(inputs, 'series')
  const names = [inputs.labelA ?? (legacy ? 'Série A' : 'Histórico completo'),
    inputs.labelB ?? (legacy ? 'Série B' : 'Com resumo')]
  header.textContent = inputs.title ?? (legacy ? 'Comparação' : 'Tokens no contexto')
  if (/^#[\da-f]{6}$/i.test(inputs.accent)) document.getElementById('stage').style.setProperty('--accent', inputs.accent)

  function makeBars() {
    const values = inputs.values ?? [12000, 3000]
    if (!Array.isArray(values) || values.length !== 2 ||
      values.some(value => !Number.isFinite(value) || value < 0)) {
      throw Error('Forneça dois valores numéricos não negativos em values.')
    }
    const scale = Math.max(...values, 1)
    const format = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 })
    const group = document.getElementById('bars')
    return values.map((value, index) => {
      const row = document.createElement('div')
      row.className = 'bar-row'
      const label = document.createElement('div')
      label.className = 'bar-label'
      const name = document.createElement('span')
      name.textContent = names[index]
      const amount = document.createElement('strong')
      amount.textContent = format.format(value)
      label.append(name, amount)
      const bar = document.createElement('div')
      bar.className = 'bar'
      bar.style.width = (100 * value / scale) + '%'
      row.append(label, bar)
      group.append(row)
      return reveal => {
        row.style.opacity = Math.min(1, reveal * 5)
        amount.style.opacity = Math.max(0, (reveal - .73) / .27)
        bar.style.transform = 'scaleX(' + reveal + ')'
      }
    })
  }

  function makeLines() {
    chart.classList.add('legacy')
    const series = inputs.series
    if (!Array.isArray(series) || series.length !== 2 || series.some(row =>
      !Array.isArray(row) || row.length !== series[0].length || row.length < 2 || row.length > 6 ||
      row.some(value => !Number.isFinite(value) || value < 0 || value > 100)
    )) throw Error('Forneça duas séries de 2 a 6 valores de 0 a 100, com o mesmo tamanho.')

    const labels = inputs.axisLabels ?? series[0].map((_, index) => 'S' + (index + 1))
    if (!Array.isArray(labels) || labels.length !== series[0].length ||
      labels.some(label => typeof label !== 'string' || label.length > 10)
    ) throw Error('Forneça uma legenda curta para cada ponto do eixo X.')

    document.querySelectorAll('#legend span').forEach((label, index) => { label.textContent = names[index] })
    if (inputs.note) {
      const note = document.getElementById('note')
      note.textContent = inputs.note
      note.hidden = false
    }

    const plot = document.getElementById('plot')
    function svg(tag, attrs, text) {
      const item = document.createElementNS('http://www.w3.org/2000/svg', tag)
      for (const [key, value] of Object.entries(attrs)) item.setAttribute(key, value)
      if (text !== undefined) item.textContent = text
      plot.append(item)
      return item
    }
    const x = index => 66 + 818 * index / (labels.length - 1)
    const y = value => 449 - 421 * value / 100
    for (let value = 0; value <= 100; value += 25) {
      const row = y(value)
      svg('line', { x1: 66, x2: 884, y1: row, y2: row, class: 'grid' })
      svg('text', { x: 47, y: row + 7, 'text-anchor': 'end' }, value)
    }
    labels.forEach((label, index) => svg('text', { x: x(index), y: 491, 'text-anchor': 'middle' }, label))
    return series.map((row, seriesIndex) => {
      const points = row.map((value, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(value)).join(' ')
      const line = svg('path', { d: points, class: 'curve ' + (seriesIndex ? 'second' : 'first'), pathLength: 100 })
      line.style.strokeDasharray = '100 100'
      return reveal => {
        line.style.strokeDashoffset = String(100 * (1 - reveal))
        line.style.opacity = reveal ? '1' : '0'
      }
    })
  }

  const reveal = legacy ? makeLines() : makeBars()
  window.renderMotion = time => {
    const enter = flow(phase(time, .02, .58))
    const show = snap(time, .32, .29)
    const exchange = flow(phase(time, 1.91, .65)) - flow(phase(time, 4.49, .65))
    const crossing = Math.sin(Math.PI * exchange) ** 1.35
    const clearFace = 1 - flow(clamp(Math.min(exchange, 1 - exchange) / .20))
    if (camera) camera.style.transform = 'translateX(' + enter * (-326 + 652 * exchange) + 'px) scale(' + mix(1, 1.39, enter) + ')'
    set(chart, {
      opacity: show * (camera ? clearFace : 1 - .15 * crossing),
      transform: 'translate(' + (-925 * exchange) + 'px,calc(-50% + ' + (19 * (1 - show) + 126 * crossing) + 'px)) scale(' + (1 - .095 * crossing) + ')',
    })
    reveal[0](snap(time, .57, .62))
    reveal[1](snap(time, 2.60, .55))
  }
  window.renderMotion(0)
</script>
</body>
</html>
