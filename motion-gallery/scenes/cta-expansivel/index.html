
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CTA Expansível</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/amber.css">
<style>
main.transparent { background: transparent; }
main.transparent .aurora { display: none; }
main:not(.transparent):has(.camera > *) .aurora { display: none; }
.camera, .camera > :is(img, video) { position: absolute; inset: 0; width: 100%; height: 100%; }
.camera > :is(img, video) { object-fit: cover; object-position: center 32%; }
.camera:has(img)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg,#100714a8,transparent 46%); }
.button {
  position: absolute; left: 50%; top: 76%; transform: translate(-50%, -50%);
  width: 112px; height: 112px; border-radius: 26px; isolation: isolate;
  display: grid; place-items: center; overflow: hidden; color: #fff0e7;
  border: 1px solid #ffaf858f;
  background: radial-gradient(ellipse at 87% 110%, #e25222 0%, transparent 58%),
    linear-gradient(159deg, #42101d, #210b12 65%, #702417);
  box-shadow: 0 18px 48px #11050bbb, inset 0 2px 2px #ffc7ac4a, inset 0 -4px 14px #0b0408b3;
}
.button::before, .button::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.button::before {
  background: repeating-linear-gradient(56deg, transparent 0 41px, #ffa17824 42px, transparent 47px 70px);
  mask-image: linear-gradient(90deg, transparent 33%, #000);
}
.button::after {
  background: linear-gradient(106deg, transparent 35%, #ff996d60 46%, #fff2d18a 48%, #fa6f2b5e 51%, transparent 62%);
  transform: translateX(var(--sweep, -116%));
  mix-blend-mode: screen;
}
.arrow {
  position: absolute; width: 48px; height: 48px; left: 50%; top: 50%;
  transform: translate(-50%, -50%); filter: drop-shadow(0 0 13px #ff8753aa); color: #ffe1cf;
}
.arrow + .arrow { color: #ffa678; }
.word {
  position: relative; display: flex; align-items: center; justify-content: center;
  color: #fff0e6; font-weight: 730; font-size: var(--font, 56px); letter-spacing: -.036em;
  white-space: pre; text-transform: uppercase; perspective: 440px; text-shadow: 0 2px 9px #2a0709;
}
.word span { display: inline-block; transform-origin: center 76%; }
</style>
</head>
<body>
<main class="amber" data-composition-id="cta-expansivel" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="aurora" aria-hidden="true"></div>
  <div class="camera"><!-- motion-media:presenter:0:8:0 --></div>
  <div class="button">
    <svg class="arrow" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9v27m-11-11 11 11 11-11" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="arrow" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9v27m-11-11 11 11 11-11" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="word"></div>
  </div>
</main>
<script src="../motion-assets/time.js"></script>
<script>
const label = typeof inputs.label === "string" && inputs.label.trim() ? inputs.label.trim() : "Inscreva-se agora";
const word = one(".word");
const letters = Array.from(label.toLocaleUpperCase("pt-BR")).map(letter => {
  const glyph = document.createElement("span");
  glyph.textContent = letter;
  word.append(glyph);
  return glyph;
});
const button = one(".button");
const arrows = all(".arrow");
const width = Math.min(980, Math.max(660, 32 * letters.length + 225));
word.style.setProperty("--font", Math.min(61, (width - 175) / (letters.length * .65)) + "px");
const expandAt = Number.isFinite(inputs.expandAt) ? Math.min(5.7, Math.max(.35, inputs.expandAt)) : 1.06;
const end = Number.isFinite(inputs.hold) ? Math.min(7.7, expandAt + 1.03 + Math.max(.1, inputs.hold)) : 7.55;
const position = inputs.position ?? {};
const edge = (width * 1.09 / 2 + 12) / 19.2;
button.style.left = Math.min(100 - edge, Math.max(edge, Number.isFinite(position.x) ? position.x : 50)) + "%";
button.style.top = Math.min(91, Math.max(12, position.y ?? 76)) + "%";
stage.classList.toggle("transparent", inputs.transparent === true && !one(".camera > *"));
if (inputs.accent) {
  button.style.background = "radial-gradient(ellipse at 90% 110%, " + inputs.accent + ", transparent 62%), linear-gradient(159deg, #42101d, #210b12 65%, #702417)";
}
window.renderMotion = time => {
  const enter = spring(time, .15, .46);
  const portrait = one(".camera > img");
  if (portrait) portrait.style.transform = "scale(" + mix(1, 1.035, phase(time, 0, 8)) + ")";
  const expand = spring(time, expandAt, .70);
  const spread = ease(phase(time, expandAt + .08, .51));
  const exit = flow(phase(time, end, .30));
  const size = mix(112, width, expand);
  set(button, {
    width: size + "px",
    opacity: Math.min(1, enter) * (1 - exit),
    transform: "translate(-50%, -50%) scale(" + (mix(.67, 1, enter) - .04 * exit) + ")"
  });
  const sweepClock = time - expandAt - .35;
  const sweep = sweepClock < 0 ? -120 : mix(-120, 130, phase(sweepClock % 2.35, 0, .87));
  button.style.setProperty("--sweep", sweep + "%");
  arrows.forEach((arrow, i) => {
    arrow.style.opacity = i ? spread : 1;
    const offset = (i ? 1 : -1) * (size / 2 - 52) * spread;
    arrow.style.transform = "translate(-50%, -50%) translateX(" + offset + "px) translateY(" + (-5 * Math.sin(Math.PI * spread)) + "px)";
  });
  letters.forEach((letter, index) => {
    const p = spring(time, expandAt + .20 + .42 * index / Math.max(1, letters.length - 1), .40);
    set(letter, {
      opacity: clamp(p),
      transform: "translateY(" + (1 - p) * 22 + "px) rotateX(" + (1 - p) * 72 + "deg) rotateZ(" + (1 - p) * (index % 2 ? 7 : -7) + "deg)"
    });
  });
};
window.renderMotion(0);
</script>
</body>
</html>
