<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Identificação do Apresentador</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<style>
main { color:#f9f9fa; }
.camera,.camera :is(video,img) { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.scrim { position:absolute; bottom:0; left:0; width:1370px; height:440px; background:radial-gradient(ellipse 86% 92% at 9% 91%,#101118d9 8%,#1011189c 48%,#10111800 83%); }
.identification { position:absolute; left:124px; bottom:128px; max-width:1130px; isolation:isolate; text-shadow:0 2px 11px #0008; }
.bar { display:block; width:100px; height:5px; margin-bottom:23px; background:#d5c1ff; transform-origin:left; }
.name { font-size:100px; letter-spacing:-.046em; font-weight:660; line-height:1; overflow-wrap:anywhere; }
.role { margin-top:15px; color:#e4d7fc; font-size:43px; font-weight:450; line-height:1.12; }
</style>
</head>
<body>
<main data-composition-id="identificacao-do-apresentador" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="camera"><!-- motion-media:presenter:0:6:0 --></div>
<div class="scrim" aria-hidden="true"></div>
<section class="identification"><i class="bar" aria-hidden="true"></i><h1 class="name"></h1><p class="role"></p></section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy(".name","name","Renato");
copy(".role","role","Aula de agentes de IA");
window.renderMotion = time => {
  const exit=flow(phase(time,5.20,.24));
  const line=spring(time,.51,.28);
  const name=snap(time,.58,.27);
  const role=snap(time,.75,.24);
  one(".scrim").style.opacity=snap(time,.48,.28)*(1-exit);
  one(".identification").style.opacity=1-exit;
  set(one(".bar"),{opacity:clamp(line),transform:"scaleX("+line+")"});
  set(one(".name"),{opacity:name,transform:"translateX("+((1-name)*-31+exit*-14)+"px)"});
  set(one(".role"),{opacity:role,transform:"translateY("+((1-role)*15+exit*9)+"px)"});
};
window.renderMotion(0);
</script>
</body>
</html>
