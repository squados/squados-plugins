<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Balanço em Contagem</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/duelo.css">
<style>
.take { inset:0 0 0 575px; mask-image:linear-gradient(90deg,transparent,#000 33%); }
.score { position:absolute; left:110px; top:109px; width:600px; padding:37px 40px 30px; border-radius:23px; }
h1 { font-size:61px; margin-bottom:32px; }
ol { margin:0; padding:0; list-style:none; }
.score.dense { width:734px; }
.dense ol { display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(7,minmax(48px,auto)); column-gap:22px; }
.dense li { font-size:25px; }
li { border-top:1px solid #fff2; display:flex; gap:17px; align-items:center; min-height:52px; padding:9px 0; font-size:30px; overflow-wrap:anywhere; }
li svg { width:27px; height:27px; color:var(--mint); flex:none; }
li path { stroke-dasharray:1; stroke-dashoffset:1; }
.total { display:flex; align-items:baseline; gap:18px; margin-top:26px; color:var(--mint); }
.total strong { font-size:100px; line-height:.85; font-variant-numeric:tabular-nums; }
.total span { font-size:33px; }
</style>
</head>
<body>
<main data-composition-id="balanco-em-contagem" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="take"><!-- motion-media:presenter:0:6:0 --></div>
<section class="score glass">
  <h1 class="duel-title"></h1>
  <ol></ol>
  <p class="total"><strong>00</strong><span></span></p>
</section>
</main>
<script src="../motion-assets/time.js"></script>
<script>
copy("h1","title","O que a IA editou");
copy(".total span","unit","tarefas");
const tasks = (inputs.tasks ?? ["Sincronizar câmera","Revelar duas marcas","Separar os planos","Animar a demonstração","Montar a maquete","Entregar o corte"]).slice(0,13);
const score = one("ol");
one(".score").classList.toggle("dense",tasks.length>8);
const step = Math.min(.47,3.5/Math.max(1,tasks.length-1));
tasks.forEach(name => {
  const row = document.createElement("li");
  row.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" pathLength="1"/></svg>';
  row.append(document.createTextNode(name));
  score.append(row);
});
window.renderMotion = time => {
  const open = beat(time,.16,.43);
  set(one(".score"),{ opacity:open, transform:"translateX(" + -50*(1-open) + "px)" });
  let done = 0;
  all("li").forEach((row,index) => {
    const start=.7+index*step;
    const visible=beat(time,start,.25);
    const checked=beat(time,start+.16,.34);
    set(row,{ opacity:visible, transform:"translateY(" + 12*(1-visible) + "px)" });
    row.querySelector("path").style.strokeDashoffset=1-checked;
    done+=checked>=1?1:0;
  });
  one(".total strong").textContent=String(done).padStart(2,"0");
};
window.renderMotion(0);
</script>
</body>
</html>
