<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card de Vidro</title>
<link rel="stylesheet" href="../motion-assets/base.css">
<link rel="stylesheet" href="../motion-assets/vidro.css">
<style>
.card { width: 600px; padding: 48px 52px 52px; top: 50%; right: 100px; }
main.left .card { right: auto; left: 100px; }
main.center .card { right: auto; left: 50%; }
.lead { display: flex; align-items: center; gap: 30px; }
.icon { width: 92px; height: 92px; flex: none; border-radius: 26px; background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #120f22)); box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 #ffffff5c; }
.value { font-size: 124px; font-weight: 700; letter-spacing: -.045em; line-height: .95; white-space: nowrap; background: linear-gradient(100deg, var(--ink) 30%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 6px; }
.title { margin-top: 30px; font-size: 52px; font-weight: 650; letter-spacing: -.025em; line-height: 1.05; }
.text { margin-top: 16px; font-size: 33px; font-weight: 430; line-height: 1.3; color: var(--muted); }
.lead:empty, .text:empty { display: none; }
</style>
</head>
<body>
<main data-composition-id="card-de-vidro" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="camera"><!-- motion-media:presenter:0:6:0 --></div>
<section class="pane card">
  <div class="rim-glow" aria-hidden="true"></div><div class="rim" aria-hidden="true"></div>
  <div class="lead"></div>
  <h1 class="title"></h1>
  <p class="text"></p>
</section>
</main>
<script src="../motion-assets/time.js"></script>
<script src="../motion-assets/icones.js"></script>
<script>
const text = (name, fallback) => typeof inputs[name] === "string" ? inputs[name].trim() : fallback;
const light = inputs.theme === "claro";
stage.classList.toggle("claro", light);
stage.classList.toggle("transparent", inputs.transparent === true && !one(".camera > *"));
if (["left", "center"].includes(inputs.side)) stage.classList.add(inputs.side);
stage.style.setProperty("--accent", inputs.accent || (light ? "#7356f0" : "#a98bff"));

const lead = one(".lead");
const iconName = text("icon", "grafico");
const valueText = text("value", "+38%");
let icon, value;
if (iconName) {
  icon = document.createElement("div");
  icon.className = "icon";
  window.motionIcon(icon, iconName);
  lead.append(icon);
}
if (valueText) {
  value = document.createElement("strong");
  value.className = "value";
  value.textContent = valueText;
  lead.append(value);
}
one(".title").textContent = text("title", "Conversão do mês");
one(".text").textContent = text("text", "Comparada ao mês anterior, com o mesmo investimento.");

const card = one(".card");
const rims = all(".rim, .rim-glow");
const parts = [one(".title"), one(".text")];
const exitAt = Number.isFinite(inputs.exitAt) ? Math.min(5.6, Math.max(1.5, inputs.exitAt)) : 5.45;
const shift = stage.classList.contains("center") ? "translate(-50%, -50%)" : "translateY(-50%)";

window.renderMotion = time => {
  const enter = snap(time, .15, .55);
  const exit = flow(phase(time, exitAt, .4));
  set(card, {
    opacity: enter * (1 - exit),
    transform: shift + " translateY(" + ((1 - enter) * 40 - exit * 16) + "px) scale(" + (mix(.965, 1, enter) - .02 * exit) + ")",
  });
  if (icon) icon.style.transform = "scale(" + Math.max(0, spring(time, .42, .5)) + ")";
  if (value) {
    const p = snap(time, .55, .45);
    set(value, { opacity: p, transform: "translateY(" + (1 - p) * 24 + "px)", filter: "blur(" + (1 - p) * 10 + "px)" });
  }
  parts.forEach((node, index) => {
    const p = snap(time, .72 + index * .14, .42);
    set(node, { opacity: p, transform: "translateY(" + (1 - p) * 18 + "px)" });
  });
  const angle = 210 + 360 * Math.max(0, time - .4) / 2.8;
  rims.forEach(rim => {
    rim.style.setProperty("--angle", angle + "deg");
    rim.style.opacity = flow(phase(time, .4, .5)) * (rim.classList.contains("rim") ? 1 : .7);
  });
};
window.renderMotion(0);
</script>
</body>
</html>
