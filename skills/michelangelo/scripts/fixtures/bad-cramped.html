<!doctype html><html><head><meta charset="utf-8"><style>
  body { margin: 0; font-family: system-ui; }
  .list { padding: 4px; }
  .row { margin: 0; padding: 1px 2px; font-size: 16px; color: #000; }
  .row + .row { margin-top: 3px; } /* gap 3px entre irmãos */
  .faint { color: #b0b0b0; background: #fff; font-size: 16px; } /* contraste ~2.5 */
  .tiny { font-size: 9px; }
</style></head><body>
  <div class="list">
    <p class="row">Primeira linha de conteúdo textual aqui.</p>
    <p class="row">Segunda linha de conteúdo textual aqui.</p>
    <p class="row">Terceira linha de conteúdo textual aqui.</p>
  </div>
  <p class="faint">Este parágrafo tem contraste insuficiente para leitura confortável.</p>
  <p class="tiny">Texto minúsculo demais para ser lido.</p>
</body></html>
