<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Proposta comercial</title>
  <style>
    html, body { margin: 0; padding: 0; background: #240403; }
    * { box-sizing: border-box; }
    section[data-slide] { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #f2e7d3; }
    .art { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; object-fit: cover; }
    h1, p { margin: 0; }
    .brand, .date, .client-label, .page { position: absolute; font-family: "Segoe UI", sans-serif; font-weight: 500; }
    .brand { left: 38px; top: 31px; font-size: 11px; letter-spacing: 3.4px; line-height: 1.3; text-transform: uppercase; }
    .date { right: 36px; top: 31px; font-size: 10px; letter-spacing: 3px; line-height: 1.3; }
    .title { position: absolute; top: 152px; left: 31px; font-family: "Times New Roman", Times, serif; font-weight: 400; }
    .title-first { display: block; font-size: 163px; line-height: 145px; letter-spacing: -6px; }
    .title-second { display: block; font-size: 155px; line-height: 147px; letter-spacing: -7px; font-style: italic; }
    .dot { color: #d15e40; }
    .subtitle { position: absolute; left: 39px; top: 442px; font-family: "Segoe UI", sans-serif; font-size: 24px; font-weight: 300; letter-spacing: 1.3px; line-height: 1.2; }
    .client-label { left: 39px; top: 633px; font-size: 10px; letter-spacing: 3.4px; line-height: 1.4; }
    .client { position: absolute; left: 39px; top: 650px; font-family: "Times New Roman", Times, serif; font-size: 30px; line-height: 1.1; letter-spacing: -1px; }
    .page { right: 36px; bottom: 36px; font-size: 13px; letter-spacing: 2px; line-height: 1; }
  </style>
</head>
<body>
  <section data-slide id="commercial-cover">
    <img class="art" src="assets/commercial.png" alt="">
    <p id="commercial-brand" class="brand">Estúdio Exemplo</p>
    <p id="commercial-date" class="date">OUTUBRO 2026</p>
    <h1 class="title"><span class="title-first" id="commercial-title-line1">Proposta</span><span class="title-second" id="commercial-title-line2">comercial<span class="dot">.</span></span></h1>
    <p id="commercial-subtitle" class="subtitle">Um novo desenho para o atendimento.</p>
    <p id="commercial-client-label" class="client-label">PREPARADO PARA</p>
    <p id="commercial-client" class="client">Empresa Exemplo</p>
    <p id="commercial-page" class="page">01</p>
  </section>
</body>
</html>
