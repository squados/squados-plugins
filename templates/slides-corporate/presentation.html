<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Corporativo</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1f3a; }
    * { box-sizing: border-box; }
    h1, p { margin: 0; }
    section[data-slide] { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #f6f7f9; color: #0b1f3a; font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .panel { position: absolute; top: 0; right: 0; width: 470px; height: 720px; background: #0b1f3a; }
    .tiles { position: absolute; top: 118px; left: 63px; display: grid; grid-template-columns: repeat(3, 104px); grid-auto-rows: 104px; gap: 14px; }
    .tile { position: relative; }
    .fill { background: #1e4fd8; }
    .sky { background: #8fb3ff; }
    .outline { border: 2px solid #8fb3ff; }
    .round-tl { border-radius: 104px 0 0 0; }
    .round-br { border-radius: 0 0 104px 0; }
    .circle { border-radius: 50%; }
    .half { background: linear-gradient(90deg, #1e4fd8 50%, transparent 50%); border: 2px solid #1e4fd8; }
    .lines { background: repeating-linear-gradient(135deg, #8fb3ff 0 2px, transparent 2px 14px); }
    .dot::after { content: ""; position: absolute; inset: 36px; border-radius: 50%; background: #f6f7f9; }
    .rule { position: absolute; left: 63px; bottom: 120px; width: 340px; height: 2px; background: #1e4fd8; }
    .panel-note { position: absolute; left: 63px; bottom: 74px; width: 340px; color: #8fb3ff; font-size: 13px; letter-spacing: 3px; line-height: 1.5; text-transform: uppercase; }
    .brand { position: absolute; left: 72px; top: 52px; display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; letter-spacing: 3px; line-height: 1; text-transform: uppercase; }
    .mark { width: 22px; height: 22px; background: #1e4fd8; box-shadow: inset 0 0 0 6px #1e4fd8, inset 0 0 0 11px #f6f7f9; }
    .date { position: absolute; left: 600px; top: 54px; width: 150px; text-align: right; color: #5b6b82; font-size: 12px; font-weight: 600; letter-spacing: 2.5px; line-height: 1; }
    .kicker { position: absolute; left: 72px; top: 196px; display: flex; align-items: center; gap: 16px; color: #1e4fd8; font-size: 14px; font-weight: 700; letter-spacing: 4px; line-height: 1; text-transform: uppercase; }
    .kicker::before { content: ""; width: 44px; height: 3px; background: #1e4fd8; }
    .title { position: absolute; left: 68px; top: 236px; width: 680px; font-weight: 600; font-size: 92px; line-height: 0.98; letter-spacing: -3px; }
    .title span { display: block; }
    .accent { color: #1e4fd8; }
    .subtitle { position: absolute; left: 72px; top: 452px; width: 670px; color: #5b6b82; font-size: 24px; font-weight: 400; line-height: 1.4; }
    .presenter-label { position: absolute; left: 72px; top: 604px; color: #5b6b82; font-size: 11px; font-weight: 600; letter-spacing: 3px; line-height: 1; text-transform: uppercase; }
    .presenter { position: absolute; left: 72px; top: 626px; font-size: 22px; font-weight: 600; line-height: 1.2; }
    .page { position: absolute; left: 690px; top: 632px; width: 60px; text-align: right; color: #5b6b82; font-size: 14px; font-weight: 600; letter-spacing: 2px; line-height: 1; }
    .footer-rule { position: absolute; left: 72px; top: 584px; width: 678px; height: 1px; background: #d5dbe5; }
  </style>
</head>
<body>
  <section data-slide id="corporate-cover">
    <div class="panel">
      <div class="tiles" aria-hidden="true">
        <div class="tile fill round-tl"></div>
        <div class="tile outline"></div>
        <div class="tile sky circle"></div>
        <div class="tile lines"></div>
        <div class="tile fill dot"></div>
        <div class="tile half"></div>
        <div class="tile sky round-br"></div>
        <div class="tile outline circle"></div>
        <div class="tile fill"></div>
      </div>
      <div class="rule" aria-hidden="true"></div>
      <p id="corporate-panel-note" class="panel-note">Resultados · Metas · Investimentos</p>
    </div>
    <p id="corporate-brand" class="brand"><span class="mark" aria-hidden="true"></span>Empresa Exemplo</p>
    <p id="corporate-date" class="date">OUTUBRO 2026</p>
    <p id="corporate-kicker" class="kicker">Plano estratégico</p>
    <h1 class="title"><span id="corporate-title-line1">Crescer com</span><span id="corporate-title-line2" class="accent">foco em 2027</span></h1>
    <p id="corporate-subtitle" class="subtitle">Prioridades, metas e investimentos para o próximo ciclo.</p>
    <div class="footer-rule" aria-hidden="true"></div>
    <p id="corporate-presenter-label" class="presenter-label">Apresentado por</p>
    <p id="corporate-presenter" class="presenter">Diretoria Executiva</p>
    <p id="corporate-page" class="page">01</p>
  </section>
</body>
</html>
