<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Relatório de resultados</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fbfaf7; }
    * { box-sizing: border-box; }
    section[data-slide] { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #020405; }
    .art { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; object-fit: cover; }
    h1, p { margin: 0; }
    .mark { position: absolute; left: 38px; top: 41px; width: 31px; height: 12px; background: #073fda; }
    .brand, .area, .month, .subtitle, .page { position: absolute; font-family: "Segoe UI", sans-serif; font-weight: 400; }
    .brand { left: 84px; top: 40px; font-size: 12px; letter-spacing: 3.4px; line-height: 1.2; }
    .area { right: 36px; top: 40px; font-size: 12px; letter-spacing: 3.5px; line-height: 1.2; }
    .title { position: absolute; left: 25px; top: 91px; font-family: "Sora", "Arial Black", sans-serif; font-size: 145px; font-weight: 700; letter-spacing: -8px; line-height: 126px; }
    .title-line { display: block; white-space: nowrap; }
    .title-first { font-size: 153px; }
    .dot { color: #073fda; font-family: "Times New Roman", Times, serif; }
    .period { position: absolute; left: 33px; top: 368px; font-family: "Segoe UI", sans-serif; font-size: 160px; font-weight: 300; letter-spacing: -11px; line-height: 1; }
    .month { left: 39px; top: 526px; font-size: 12px; font-weight: 600; letter-spacing: 5px; line-height: 1.3; }
    .subtitle { left: 38px; top: 664px; font-size: 15px; letter-spacing: 0.5px; line-height: 1.3; }
    .page { right: 36px; bottom: 36px; color: #f8f6ef; font-size: 13px; letter-spacing: 1px; line-height: 1; }
  </style>
</head>
<body>
  <section data-slide id="results-cover">
    <img class="art" src="assets/results.png" alt="">
    <div class="mark"></div>
    <p id="results-brand" class="brand">EMPRESA EXEMPLO</p>
    <p id="results-area" class="area">ÁREA COMERCIAL</p>
    <h1 class="title"><span class="title-line title-first" id="results-title-line1">Relatório</span><span class="title-line" id="results-title-line2">de resultados<span class="dot">.</span></span></h1>
    <p id="results-period" class="period">06.2026</p>
    <p id="results-month" class="month">JUNHO</p>
    <p id="results-subtitle" class="subtitle">Desempenho, aprendizados e prioridades.</p>
    <p id="results-page" class="page">01</p>
  </section>
</body>
</html>
