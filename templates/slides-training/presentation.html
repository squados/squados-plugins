<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Treinamento</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fb4c13; }
    * { box-sizing: border-box; }
    section[data-slide] { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #291326; }
    .art { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; object-fit: cover; }
    h1, p { margin: 0; }
    .kind, .format, .credit, .company, .page { position: absolute; font-family: "Segoe UI", sans-serif; }
    .kind { left: 39px; top: 22px; font-size: 15px; font-weight: 700; letter-spacing: 3.3px; line-height: 1.3; }
    .format { right: 36px; top: 22px; font-size: 15px; font-weight: 700; letter-spacing: 3.3px; line-height: 1.3; }
    .title { position: absolute; left: 34px; top: 54px; font-family: "Anton", Impact, sans-serif; font-weight: 400; }
    .title-first { display: block; font-size: 244px; line-height: 213px; letter-spacing: -2px; }
    .title-second { display: block; font-size: 228px; line-height: 212px; letter-spacing: -1px; }
    .dot { font-family: "Times New Roman", Times, serif; font-weight: 700; }
    .subtitle { position: absolute; left: 41px; top: 475px; font-family: "Anton", Impact, sans-serif; font-size: 32px; font-weight: 400; letter-spacing: 0.6px; line-height: 1.2; color: #ffe3b9; }
    .credit { left: 39px; top: 642px; font-size: 11px; font-weight: 600; letter-spacing: 2.3px; line-height: 1.4; }
    .company { left: 39px; top: 661px; font-size: 17px; font-weight: 400; line-height: 1.3; }
    .page { right: 36px; bottom: 36px; font-size: 14px; font-weight: 600; line-height: 1; }
  </style>
</head>
<body>
  <section data-slide id="training-cover">
    <img class="art" src="assets/training.png" alt="">
    <p id="training-kind" class="kind">TREINAMENTO</p>
    <p id="training-format" class="format">OFICINA PRÁTICA</p>
    <h1 class="title"><span class="title-first" id="training-title-line1">Aprender</span><span class="title-second" id="training-title-line2">fazendo<span class="dot">.</span></span></h1>
    <p id="training-subtitle" class="subtitle">Reuniões que terminam com decisões claras.</p>
    <p id="training-credit" class="credit">EXEMPLOS, PRÁTICA E APLICAÇÃO</p>
    <p id="training-company" class="company">Empresa Exemplo</p>
    <p id="training-page" class="page">01</p>
  </section>
</body>
</html>
