<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Futurista</title>
  <style>
    html, body { margin: 0; padding: 0; background: #05060f; }
    * { box-sizing: border-box; }
    h1, p { margin: 0; }
    section[data-slide] { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #e8ecff; font-family: Bahnschrift, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; background: radial-gradient(circle at 78% 42%, #2a1a5e 0, #0b0f2a 38%, #05060f 70%); }
    .mono { font-family: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; }
    .floor { position: absolute; left: -320px; right: -320px; bottom: -260px; height: 520px; background-image: linear-gradient(#34e7f8 1px, transparent 1px), linear-gradient(90deg, #34e7f8 1px, transparent 1px); background-size: 64px 64px; transform: perspective(520px) rotateX(64deg); transform-origin: 50% 0; opacity: 0.32; -webkit-mask-image: linear-gradient(transparent, #000 45%); mask-image: linear-gradient(transparent, #000 45%); }
    .horizon { position: absolute; left: 0; right: 0; top: 458px; height: 1px; background: linear-gradient(90deg, transparent, #34e7f8 30%, #8b5cf6 70%, transparent); box-shadow: 0 0 18px #34e7f8; }
    .orb { position: absolute; left: 856px; top: 112px; width: 300px; height: 300px; border-radius: 50%; background: conic-gradient(from 210deg, #34e7f8, #8b5cf6, #f472b6, #34e7f8); -webkit-mask-image: radial-gradient(circle, transparent 61%, #000 62%, #000 69%, transparent 70%); mask-image: radial-gradient(circle, transparent 61%, #000 62%, #000 69%, transparent 70%); filter: drop-shadow(0 0 22px #8b5cf6); }
    .halo { position: absolute; left: 806px; top: 62px; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(52, 231, 248, 0.35); }
    .halo.inner { left: 906px; top: 162px; width: 200px; height: 200px; border-style: dashed; border-color: rgba(244, 114, 182, 0.5); }
    .core { position: absolute; left: 986px; top: 242px; width: 40px; height: 40px; border-radius: 50%; background: #e8ecff; box-shadow: 0 0 30px 10px #8b5cf6, 0 0 80px 30px rgba(52, 231, 248, 0.4); }
    .corner { position: absolute; width: 28px; height: 28px; border-color: #34e7f8; border-style: solid; border-width: 0; }
    .tl { left: 32px; top: 32px; border-top-width: 2px; border-left-width: 2px; }
    .tr { right: 32px; top: 32px; border-top-width: 2px; border-right-width: 2px; }
    .bl { left: 32px; bottom: 32px; border-bottom-width: 2px; border-left-width: 2px; }
    .br { right: 32px; bottom: 32px; border-bottom-width: 2px; border-right-width: 2px; }
    .brand { position: absolute; left: 72px; top: 64px; color: #34e7f8; font-size: 14px; letter-spacing: 3px; line-height: 1; }
    .date { position: absolute; right: 72px; top: 64px; color: #7a83b0; font-size: 14px; letter-spacing: 3px; line-height: 1; }
    .kicker { position: absolute; left: 72px; top: 170px; display: flex; align-items: center; gap: 14px; color: #f472b6; font-size: 15px; letter-spacing: 4px; line-height: 1; text-transform: uppercase; }
    .kicker::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #f472b6; box-shadow: 0 0 12px #f472b6; }
    .title { position: absolute; left: 66px; top: 204px; width: 760px; font-weight: 300; font-size: 108px; line-height: 1; letter-spacing: 6px; text-transform: uppercase; }
    .title > span { display: block; white-space: nowrap; }
    .glow { margin-top: -16px; padding-top: 16px; font-weight: 700; background: linear-gradient(90deg, #34e7f8, #8b5cf6 60%, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 18px rgba(139, 92, 246, 0.55)); }
    .subtitle { position: absolute; left: 72px; top: 452px; width: 700px; padding: 6px 0 6px 18px; border-left: 2px solid #34e7f8; color: #b9c0e6; font-size: 24px; line-height: 1.4; background: linear-gradient(90deg, rgba(5, 6, 15, 0.85), rgba(5, 6, 15, 0)); }
    .meta { position: absolute; left: 72px; top: 612px; display: flex; align-items: center; gap: 18px; color: #7a83b0; font-size: 13px; letter-spacing: 3px; line-height: 1; }
    .bars { display: flex; gap: 5px; }
    .bars i { width: 22px; height: 6px; background: #34e7f8; box-shadow: 0 0 8px #34e7f8; }
    .bars i:nth-child(n + 4) { background: #2a2f55; box-shadow: none; }
    .page { position: absolute; right: 72px; top: 612px; color: #34e7f8; font-size: 13px; letter-spacing: 3px; line-height: 1; }
  </style>
</head>
<body>
  <section data-slide id="futuristic-cover">
    <div class="floor" aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>
    <div class="halo inner" aria-hidden="true"></div>
    <div class="orb" aria-hidden="true"></div>
    <div class="core" aria-hidden="true"></div>
    <div class="corner tl" aria-hidden="true"></div>
    <div class="corner tr" aria-hidden="true"></div>
    <div class="corner bl" aria-hidden="true"></div>
    <div class="corner br" aria-hidden="true"></div>
    <p id="futuristic-brand" class="brand mono">EMPRESA//EXEMPLO</p>
    <p id="futuristic-date" class="date mono">OUT.2026 — V1.0</p>
    <p id="futuristic-kicker" class="kicker mono">Lançamento</p>
    <h1 class="title"><span id="futuristic-title-line1">Próxima</span><span id="futuristic-title-line2" class="glow">geração</span></h1>
    <p id="futuristic-subtitle" class="subtitle">A nova plataforma de dados que conecta toda a operação.</p>
    <div class="meta mono"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="futuristic-presenter">KEYNOTE · TIME DE PRODUTO</span></div>
    <p id="futuristic-page" class="page mono">01 / 01</p>
  </section>
</body>
</html>
