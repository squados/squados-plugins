<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Efeitos de motion da Skillry com nomes, prompts de uso e links para as prévias oficiais.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='9' width='40' height='30' rx='5' fill='%23b9a9fa'/%3E%3Cpath d='m20 16 12 8-12 8Z' fill='%23262234'/%3E%3C/svg%3E">
  <title>Galeria de motion | SquadOS</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-content">
      <span class="wordmark">SquadOS</span>
      <a href="#catalogo">Catálogo</a>
    </div>
  </header>
  <main class="wrap" id="catalogo">
    <div class="intro">
      <div>
        <h1>Galeria de motion</h1>
        <p>Encontre efeitos do CreatorMotion e cenas do LaunchMotion. Abra a prévia oficial na Skillry e cite o nome ao pedir para usar no vídeo.</p>
      </div>
      <div class="intro-frames" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="toolbar" aria-label="Filtros do catálogo">
      <label class="field field-search">
        <span>Buscar efeito</span>
        <input type="search" id="query" placeholder="Nome, coleção ou ID" autocomplete="off">
      </label>
      <label class="field">
        <span>Categoria</span>
        <select id="category"><option value="">Todas as categorias</option></select>
      </label>
      <output id="total" aria-live="polite"></output>
    </div>
    <noscript>Ative o JavaScript do navegador para consultar o catálogo.</noscript>
    <div id="groups"></div>
    <p class="empty" id="empty" hidden>Nenhum efeito encontrado. Tente outro nome ou categoria.</p>
    <footer>Galeria de motion do SquadOS <a href="catalog.json">Catálogo JSON</a></footer>
  </main>
  <script id="catalog" type="application/json"><!-- CATALOG --></script>
  <script src="gallery.js" defer></script>
</body>
</html>
