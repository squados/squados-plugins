<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pulo Alto</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c3e3ff; }
    body { display: grid; place-items: center; font-family: system-ui, "Segoe UI", sans-serif; color: #2f3445; user-select: none; -webkit-user-select: none; }
    #stage { position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(47 52 69 / 0.35); }
    .overlay[hidden] { display: none; }
    .card { width: min(88%, 520px); padding: 28px 32px; text-align: center; background: #fff; border: 4px solid #2f3445; border-radius: 20px; box-shadow: 0 8px 0 #2f3445; }
    .card h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); font-weight: 900; }
    .card p { margin: 0 0 12px; font-size: clamp(14px, 2.2vw, 18px); line-height: 1.4; }
    .card .keys { color: #6a7088; font-size: clamp(12px, 1.8vw, 15px); }
    .card button { margin-top: 6px; padding: 12px 28px; font: inherit; font-size: 18px; font-weight: 800; color: #fff; background: #2ecc71; border: 4px solid #2f3445; border-radius: 14px; box-shadow: 0 4px 0 #2f3445; cursor: pointer; }
    .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2f3445; }
    .touch { position: absolute; bottom: 4%; display: none; gap: 12px; }
    .touch.left { left: 3%; }
    .touch.right { right: 3%; }
    .touch button { width: 76px; height: 76px; font-size: 30px; color: #2f3445; background: rgb(255 255 255 / 0.7); border: 3px solid #2f3445; border-radius: 50%; touch-action: none; }
    @media (pointer: coarse) { .touch { display: flex; } }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="768"></canvas>
    <div class="touch left">
      <button data-key="left" aria-label="Esquerda">◀</button>
      <button data-key="right" aria-label="Direita">▶</button>
    </div>
    <div class="touch right">
      <button data-key="jump" aria-label="Pular">▲</button>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h1 id="overlay-title">Pulo Alto</h1>
        <p id="overlay-text">Atravesse a colina, pule em cima dos slimes e alcance a bandeira.</p>
        <p class="keys">← → ou A D andam · Espaço, ↑ ou W pula · P pausa</p>
        <button id="overlay-button">Jogar</button>
      </div>
    </div>
  </div>
  <script src="level.js"></script>
  <script src="game.js"></script>
</body>
</html>
